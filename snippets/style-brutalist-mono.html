<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>粗野极简 · Brutalist mono</title>
<style>
  html,body{margin:0;height:100%;background:#0a0a0a;overflow:hidden}
  #wrap{display:flex;align-items:center;justify-content:center;height:100%}
  canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="1280" height="720"></canvas></div>
<script>
const W=1280,H=720,DUR=12;
const g=document.getElementById('c').getContext('2d');

const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
function spring(t,k=170,d=26){
  if(t<=0)return 0;
  const w0=Math.sqrt(k),z=d/(2*w0);
  if(z<1){const wd=w0*Math.sqrt(1-z*z);
    return 1-Math.exp(-z*w0*t)*(Math.cos(wd*t)+(z*w0/wd)*Math.sin(wd*t));}
  return 1-Math.exp(-w0*t)*(1+w0*t);
}
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;
  let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;
  return((t^t>>>14)>>>0)/4294967296;};}


const PAPER='#eef0ee', INK='#0d0d0d';


const SCENES=[
{from:0,to:4,draw(t){
  g.fillStyle=PAPER;g.fillRect(0,0,W,H);
  g.strokeStyle=INK;g.lineWidth=2;
  for(let x=0;x<W;x+=80){g.beginPath();g.moveTo(x,0);g.lineTo(x,H);g.stroke();}
  for(let y=0;y<H;y+=80){g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke();}
  const r=spring(t-0.2,90,16);
  g.fillStyle=INK;g.font='900 96px monospace';g.textAlign='center';g.textBaseline='middle';
  g.globalAlpha=r;g.fillText('BRUTAL',W/2,H/2);g.globalAlpha=1;
}},
{from:4,to:8,draw(t){
  g.fillStyle=PAPER;g.fillRect(0,0,W,H);
  // 硬边色块 + 等宽
  const r=spring(t-0.2,200,14);
  g.fillStyle=INK;g.fillRect(W/2-400,H/2-120,800*r,240);
  g.fillStyle=PAPER;g.font='900 84px monospace';g.textAlign='center';g.textBaseline='middle';
  g.fillText('MONO / GRID',W/2,H/2);
}},
{from:8,to:12,draw(t){
  g.fillStyle=INK;g.fillRect(0,0,W,H);
  const r=spring(t-0.2,90,16);
  g.fillStyle=PAPER;g.font='900 70px monospace';g.textAlign='center';g.textBaseline='middle';
  g.globalAlpha=r;g.fillText('NO ROUND CORNER',W/2,H/2);g.globalAlpha=1;
}}
];

function draw(t){
  g.setTransform(1,0,0,1,0,0);
  g.clearRect(0,0,W,H);
  for(const s of SCENES){ if(t>=s.from&&t<s.to) s.draw(t-s.from); }
}
window.seek=(t)=>{draw(clamp(t,0,DUR));return true;};
if(!navigator.webdriver){
  const t0=performance.now();
  (function loop(){draw(((performance.now()-t0)/1000)%DUR);requestAnimationFrame(loop);})();
}
</script>
</body>
</html>
