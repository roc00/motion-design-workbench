<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>环绕集成 · Orbit integrations</title>
<style>
  html,body{margin:0;height:100%;background:#0a0e17;overflow:hidden}
  #wrap{display:flex;align-items:center;justify-content:center;height:100%}
  canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="1280" height="720"></canvas></div>
<script>
/* ============================ FILM KIT ============================ */
const W=1280,H=720,DUR=15;
const g=document.getElementById('c').getContext('2d');
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(a,b,t)=>{t=clamp(t);t=t*t*(3-2*t);return lerp(a,b,t);};
const easeOutCubic=t=>1-Math.pow(1-t,3);
const easeInOutCubic=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const easeOutBack=t=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);};
function spring(t,k=170,d=26){
  if(t<=0)return 0;
  const w0=Math.sqrt(k),z=d/(2*w0);
  if(z<1){const wd=w0*Math.sqrt(1-z*z);
    return 1-Math.exp(-z*w0*t)*(Math.cos(wd*t)+(z*w0/wd)*Math.sin(wd*t));}
  return 1-Math.exp(-w0*t)*(1+w0*t);
}
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;
  let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;
  return((t^t>>>14)>>>0)/4294967296;};}
/* value noise on a seeded lattice */
function makeNoise(seed){
  const r=rng(seed),G=new Map();
  const at=(ix,iy)=>{const k=ix+','+iy;if(!G.has(k))G.set(k,r()*2-1);return G.get(k);};
  const fade=t=>t*t*(3-2*t);
  return(x,y)=>{
    const x0=Math.floor(x),y0=Math.floor(y),fx=fade(x-x0),fy=fade(y-y0);
    return lerp(lerp(at(x0,y0),at(x0+1,y0),fx),lerp(at(x0,y0+1),at(x0+1,y0+1),fx),fy);
  };
}
const noise=makeNoise(1337);
const C={ink:'#0a0e17',panel:'#121a2b',fg:'#eef2f7',muted:'#7f8ba0',cyan:'#45d1e6',warm:'#f0b95c',indigo:'#7c8cff'};
function rr(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();
}
/* ============================ WORLD LAYERS ============================ */
const PR=rng(20240922);
const PARTICLES=[];
for(let i=0;i<150;i++){
  const z=0.25+PR()*0.75;
  PARTICLES.push({x:PR()*W,y:PR()*H,z,sp:0.15+PR()*0.4,ph:PR()*6.28,r:0.5+z*1.6,
    hue:PR()<0.12?'warm':(PR()<0.2?'indigo':'cyan')});
}
function drawParticles(t,camX,camY,alpha=1){
  for(const p of PARTICLES){
    const dx=Math.sin(t*p.sp+p.ph)*14,dy=Math.cos(t*p.sp*0.8+p.ph)*10;
    const x=((p.x+dx-camX*p.z*1.4)%W+W)%W;
    const y=((p.y+dy-camY*p.z*1.4)%H+H)%H;
    const col=p.hue==='warm'?C.warm:p.hue==='indigo'?C.indigo:C.cyan;
    g.globalAlpha=p.z*0.55*alpha;g.fillStyle=col;
    g.beginPath();g.arc(x,y,p.r,0,6.28);g.fill();
  }g.globalAlpha=1;
}
function drawGrid(t,camX,camY,alpha=1){
  const gap=52,size=1.4;
  g.globalAlpha=0.5*alpha;
  const ox=(-camX*0.5)%gap,oy=(-camY*0.5)%gap;
  for(let x=ox;x<W;x+=gap)for(let y=oy;y<H;y+=gap){
    const b=0.35+0.3*noise(x*0.02,y*0.02+t*0.05);
    g.globalAlpha=b*alpha*0.5;g.fillStyle='#5b78a8';
    g.fillRect(x-size/2,y-size/2,size,size);
  }g.globalAlpha=1;
}
const GLYPH='01<>[]{};:=.+-*#$abcdef';
function drawChars(t,camX,camY,alpha=1){
  const cell=30,cols=Math.ceil(W/cell)+1,rows=Math.ceil(H/cell)+1;
  g.font='13px ui-monospace,Menlo,monospace';g.textAlign='center';g.textBaseline='middle';
  for(let i=0;i<cols;i++)for(let j=0;j<rows;j++){
    const x=i*cell+((-camX*0.4)%cell),y=j*cell+((-camY*0.4)%cell);
    const n=noise(i*0.35,j*0.35+t*0.12);
    if(n>0.15){
      g.globalAlpha=clamp(n)*0.5*alpha;g.fillStyle='#5fd6e6';
      g.fillText(GLYPH[Math.floor(Math.abs(n*997))%GLYPH.length],x,y);
    }
  }g.globalAlpha=1;
}
function drawGradient(t,camX,camY,alpha=1){
  const blobs=[[0.25,0.3,420,C.cyan,0.12],[0.75,0.7,520,C.indigo,0.12],[0.6,0.25,300,C.warm,0.08]];
  for(const [bx,by,r,col,a] of blobs){
    const x=bx*W+Math.sin(t*0.2+bx)*30-camX*0.3,y=by*H+Math.cos(t*0.16+by)*24-camY*0.3;
    const gr=g.createRadialGradient(x,y,0,x,y,r);
    gr.addColorStop(0,col);gr.addColorStop(1,'rgba(0,0,0,0)');
    g.globalAlpha=a*alpha/0.12;g.fillStyle=gr;g.fillRect(0,0,W,H);
  }g.globalAlpha=1;
}
function drawWorld(kind,t,camX,camY){
  g.fillStyle=C.ink;g.fillRect(0,0,W,H);
  const gr=g.createRadialGradient(W*0.5,H*0.45,80,W*0.5,H*0.5,760);
  gr.addColorStop(0,'#0e1525');gr.addColorStop(1,'#070a12');
  g.fillStyle=gr;g.fillRect(0,0,W,H);
  if(kind==='particle-field')drawParticles(t,camX,camY);
  else if(kind==='grid')drawGrid(t,camX,camY);
  else if(kind==='character-field')drawChars(t,camX,camY);
  else if(kind==='gradient-field')drawGradient(t,camX,camY);
  else drawParticles(t,camX,camY,0.4);
}
function vignette(){
  const gr=g.createRadialGradient(W/2,H/2,240,W/2,H/2,760);
  gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,.5)');
  g.fillStyle=gr;g.fillRect(0,0,W,H);
}
function grain(t){
  const r=rng(99+Math.floor(t*12));
  g.globalAlpha=0.05;
  for(let i=0;i<70;i++){
    g.fillStyle=r()<0.5?'#fff':'#000';
    g.fillRect(r()*W,r()*H,1.2,1.2);
  }g.globalAlpha=1;
}
function drawCursor(x,y,scale=1){
  g.save();g.translate(x,y);g.scale(scale,scale);
  g.beginPath();g.moveTo(0,0);g.lineTo(0,16);g.lineTo(4.5,12);g.lineTo(7,19);g.lineTo(9.5,18);g.lineTo(7,11);g.lineTo(12,11);
  g.closePath();g.fillStyle='#fff';g.fill();g.lineWidth=0.8;g.strokeStyle='#000';g.stroke();
  g.restore();
}
/* ===================== FILM: ORBIT INTEGRATIONS ===================== */
const O = { cx:640, cy:360, R:250 };
const INTEG = ['GitHub','Slack','Figma','Vercel','Linear','Notion','Stripe','Postgres'];
const INTEG_COLOR = { GitHub:'#e0e3ea', Slack:'#7cc3ff', Figma:'#f0b95c', Vercel:'#eef2f7',
  Linear:'#7c8cff', Notion:'#e8e4d8', Stripe:'#8ac6ff', Postgres:'#45d1e6' };
function orbitPos(i, rot, k){
  const n = INTEG.length;
  const a = i/n*6.28 + rot;
  const x = O.cx + Math.cos(a)*O.R;
  const y = O.cy + Math.sin(a)*O.R*0.46;
  const z = Math.sin(a);
  return { x, y, z, a };
}
function orbitWorld(t){
  g.fillStyle='#0a0e17';g.fillRect(0,0,W,H);
  const gr=g.createRadialGradient(O.cx,O.cy,40,O.cx,O.cy,620);
  gr.addColorStop(0,'#111b2e');gr.addColorStop(1,'#070a12');g.fillStyle=gr;g.fillRect(0,0,W,H);
}
function drawChip(x,y,z,name,scale,glow){
  const w=120*scale,h=44*scale;
  g.save();
  if(glow){g.shadowColor='rgba(69,209,230,.7)';g.shadowBlur=24;}
  g.fillStyle=glow?'rgba(255,255,255,.96)':'rgba(22,30,46,.92)';
  rr(x-w/2,y-h/2,w,h,12);g.fill();
  g.shadowBlur=0;
  g.strokeStyle=glow?C.cyan:'rgba(120,150,190,.5)';g.lineWidth=1.4;
  rr(x-w/2,y-h/2,w,h,12);g.stroke();
  const dot=INTEG_COLOR[name];
  g.fillStyle=glow?dot:dot;g.globalAlpha=glow?1:0.9;
  g.beginPath();g.arc(x-w/2+18*scale,y,5*scale,0,6.28);g.fill();
  g.fillStyle=glow?'#0e1525':'#dfe6f2';g.font='700 '+Math.round(15*scale)+'px Inter';
  g.textAlign='left';g.textBaseline='middle';
  g.fillText(name, x-w/2+30*scale, y);
  g.restore();
}
function scOHub(t){
  orbitWorld(t);
  /* hero present at first frame; subtle pulse only */
  const p=1;
  /* orbit rings */
  g.strokeStyle='rgba(90,130,190,.28)';g.lineWidth=1.5;
  g.beginPath();g.ellipse(O.cx,O.cy,O.R,O.R*0.46,0,0,6.28);g.stroke();
  g.strokeStyle='rgba(90,130,190,.15)';
  g.beginPath();g.ellipse(O.cx,O.cy,O.R*0.7,O.R*0.7*0.46,0,0,6.28);g.stroke();
  /* center hub */
  const pulse=1+Math.sin(t*2)*0.015;
  g.save();g.translate(O.cx,O.cy);g.scale(pulse,pulse);g.translate(-O.cx,-O.cy);
  g.fillStyle='#101a2c';g.shadowColor='rgba(69,209,230,.5)';g.shadowBlur=30;
  g.beginPath();g.arc(O.cx,O.cy,62,0,6.28);g.fill();
  g.shadowBlur=0;g.strokeStyle=C.cyan;g.lineWidth=2.5;g.stroke();
  g.fillStyle=C.fg;g.font='800 26px Inter';g.textAlign='center';g.textBaseline='middle';
  g.fillText('Hub',O.cx,O.cy-8);
  g.fillStyle=C.muted;g.font='600 13px Inter';g.fillText('已连接',O.cx,O.cy+14);
  g.restore();
}
function scOChips(t){
  orbitWorld(t);
  const rot = -0.2 + t*0.18;
  g.strokeStyle='rgba(90,130,190,.28)';g.lineWidth=1.5;
  g.beginPath();g.ellipse(O.cx,O.cy,O.R,O.R*0.46,0,0,6.28);g.stroke();
  const list=[];
  for(let i=0;i<INTEG.length;i++){
    const arrive=clamp(spring(t-0.3-i*0.12,110,16));
    list.push({i,arrive,pos:orbitPos(i,rot)});
  }
  list.sort((a,b)=>a.pos.z-b.pos.z);
  /* hub */
  g.fillStyle='#101a2c';g.beginPath();g.arc(O.cx,O.cy,62,0,6.28);g.fill();
  g.strokeStyle=C.cyan;g.lineWidth=2.5;g.stroke();
  g.fillStyle=C.fg;g.font='800 26px Inter';g.textAlign='center';g.textBaseline='middle';
  g.fillText('Hub',O.cx,O.cy-8);g.fillStyle=C.muted;g.font='600 13px Inter';
  g.fillText('8 个应用',O.cx,O.cy+14);
  for(const it of list){
    if(it.arrive<=0)continue;
    const scale=0.5+0.5*it.arrive;
    const from={x:O.cx,y:O.cy};
    const x=lerp(from.x,it.pos.x,it.arrive),y=lerp(from.y,it.pos.y,it.arrive);
    /* connector */
    g.save();g.globalAlpha=it.arrive*0.35;g.strokeStyle=C.muted;g.lineWidth=1;
    g.beginPath();g.moveTo(O.cx,O.cy);g.lineTo(it.pos.x,it.pos.y);g.stroke();g.restore();
    drawChip(x,y,it.pos.z,INTEG[it.i],scale,false);
  }
}
function scOFocus(t){
  orbitWorld(t);
  const rot=0.2;
  g.strokeStyle='rgba(90,130,190,.2)';g.lineWidth=1.5;
  g.beginPath();g.ellipse(O.cx,O.cy,O.R,O.R*0.46,0,0,6.28);g.stroke();
  for(let i=0;i<INTEG.length;i++){
    const p=orbitPos(i,rot);
    if(i===0)continue;
    g.save();g.globalAlpha=0.4;g.strokeStyle=C.muted;g.lineWidth=1;
    g.beginPath();g.moveTo(O.cx,O.cy);g.lineTo(p.x,p.y);g.stroke();g.restore();
    drawChip(p.x,p.y,p.z,INTEG[i],0.85,false);
  }
  g.fillStyle='#101a2c';g.beginPath();g.arc(O.cx,O.cy,62,0,6.28);g.fill();
  g.strokeStyle=C.cyan;g.lineWidth=2;g.stroke();
  g.fillStyle=C.fg;g.font='800 24px Inter';g.textAlign='center';g.textBaseline='middle';
  g.fillText('Hub',O.cx,O.cy);
  /* highlighted GitHub chip with bright connector */
  const p=orbitPos(0,rot);
  const pulse=clamp(spring(t-0.2,110,17));
  g.save();g.strokeStyle=C.cyan;g.lineWidth=2.5;g.globalAlpha=p;
  g.setLineDash([6,5]);g.beginPath();g.moveTo(O.cx,O.cy);g.lineTo(p.x,p.y);g.stroke();
  g.setLineDash([]);g.restore();
  drawChip(p.x,p.y,p.z,'GitHub',1+pulse*0.12,true);
}
function scOFlow(t){
  orbitWorld(t);
  const rot=0.2;
  for(let i=0;i<INTEG.length;i++){
    const p=orbitPos(i,rot);
    if(i===0)continue;
    drawChip(p.x,p.y,p.z,INTEG[i],0.82,false);
  }
  g.fillStyle='#101a2c';g.beginPath();g.arc(O.cx,O.cy,62,0,6.28);g.fill();
  g.strokeStyle=C.cyan;g.lineWidth=2;g.stroke();
  g.fillStyle=C.fg;g.font='800 24px Inter';g.textAlign='center';g.textBaseline='middle';
  g.fillText('Hub',O.cx,O.cy);
  const p=orbitPos(0,rot);
  drawChip(p.x,p.y,p.z,'GitHub',1,true);
  /* flowing data packets */
  for(let k=0;k<4;k++){
    const ph=((t*0.6+k*0.25)%1);
    const x=lerp(p.x,O.cx,ph),y=lerp(p.y,O.cy,ph);
    g.fillStyle=C.cyan;g.globalAlpha=Math.sin(ph*Math.PI)*0.9;
    g.beginPath();g.arc(x,y,4,0,6.28);g.fill();
  }
  g.globalAlpha=1;
}
function scOLockup(t){
  orbitWorld(t);
  const a=spring(t-0.2,100,15);
  for(let i=0;i<INTEG.length;i++){
    const p=orbitPos(i,0.2);
    g.save();g.globalAlpha=0.5;drawChip(p.x,p.y,p.z,INTEG[i],0.8,false);g.restore();
  }
  g.fillStyle='#101a2c';g.beginPath();g.arc(O.cx,O.cy,58,0,6.28);g.fill();
  g.strokeStyle=C.cyan;g.lineWidth=2;g.stroke();
  g.fillStyle=C.fg;g.font='800 22px Inter';g.textAlign='center';g.textBaseline='middle';
  g.fillText('Hub',O.cx,O.cy);
  g.save();g.globalAlpha=a;
  g.fillStyle=C.fg;g.font='800 48px Inter';g.textAlign='center';
  g.fillText('一处接入，处处协同',640,640);
  g.restore();
}
const SCENES = [
  { from:0, to:2.6, draw:scOHub, out:'match-cut' },
  { from:2.6, to:6.2, draw:scOChips, out:'match-cut' },
  { from:6.2, to:9.4, draw:scOFocus, out:'match-cut' },
  { from:9.4, to:12.2, draw:scOFlow, out:'match-cut' },
  { from:12.2, to:15, draw:scOLockup, out:'hard-cut' },
];

function drawWrapped(i,lt,zoom,alpha,blur,dx){
  g.save();
  g.globalAlpha=alpha;
  if(blur>0.2)g.filter='blur('+blur+'px)';
  g.translate(dx,0);
  g.translate(W/2,H/2);g.scale(zoom,zoom);g.translate(-W/2,-H/2);
  SCENES[i].draw(lt);
  g.restore();
}
function draw(t){
  g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,W,H);
  let i=SCENES.findIndex(s=>t>=s.from&&t<s.to);
  if(i<0)i=SCENES.length-1;
  const s=SCENES[i];
  const lt=t-s.from;
  const seamLen=0.32;
  const into=t-s.from; // time since shot start
  /* first frame complete rule */
  if(i===0){drawWrapped(0,lt,1,1,0,0);vignette();grain(t);return;}
  /* draw current scene; if near a seam, blend with previous according to type */
  const prevType=SCENES[i-1].out;
  if(into<seamLen && prevType!=='hard-cut'){
    const p=into/seamLen;
    if(prevType==='push-through'){
      const e=easeInOutCubic(p);
      drawWrapped(i-1,SCENES[i-1].to-SCENES[i-1].from,1+0.1*e,1-e,5*e,-30*e);
      drawWrapped(i,0,1.1-0.1*e,e,5*(1-e),60*(1-e));
    }else if(prevType==='match-cut'){
      const e=easeOutCubic(p);
      drawWrapped(i-1,SCENES[i-1].to-SCENES[i-1].from,1,1,0,0);
      drawWrapped(i,0,1.05-0.05*e,e,3*(1-e),0);
    }else if(prevType==='whip-cut'){
      const e=easeInOutCubic(p);
      drawWrapped(i-1,SCENES[i-1].to-SCENES[i-1].from,1.02,1-p,14*(1-p),-W*0.6*e);
      drawWrapped(i,0,1.02,e,14*(1-e),W*0.6*(1-e));
    }
  }else{
    drawWrapped(i,lt,1,1,0,0);
  }
  /* hard-cut flash-free: just a tiny alpha pop */
  if(prevType==='hard-cut' && into<0.09){
    drawWrapped(i,lt,1,clamp(into/0.09),0,0);
  }
  vignette();grain(t);
}
window.seek=(t)=>{t=clamp(t,0,DUR);draw(t);window.__auto=false;window.__curT=t;return true;};
window.play=(t0)=>{if(typeof t0==='number')window.__curT=t0;window.__auto=true;};
window.pause=()=>{window.__auto=false;};
window.getTime=()=>window.__curT||0;
window.DUR=DUR;
let __curT=0,lastNow=performance.now();
if(!navigator.webdriver){
  (function loop(){
    const now=performance.now();
    if(window.__auto!==false){__curT=(__curT+(now-lastNow)/1000)%DUR;window.__curT=__curT;draw(__curT);}
    lastNow=now;
    requestAnimationFrame(loop);
  })();
}
</script>
</body>
</html>
