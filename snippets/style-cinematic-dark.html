<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>电影暗色 · Cinematic dark</title>
<style>
  html,body{margin:0;height:100%;background:#0a0a0a;overflow:hidden}
  #wrap{display:flex;align-items:center;justify-content:center;height:100%}
  canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="1280" height="720"></canvas></div>
<script>
const W=1280,H=720,DUR=12;
const g=document.getElementById('c').getContext('2d');

const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
function spring(t,k=170,d=26){
  if(t<=0)return 0;
  const w0=Math.sqrt(k),z=d/(2*w0);
  if(z<1){const wd=w0*Math.sqrt(1-z*z);
    return 1-Math.exp(-z*w0*t)*(Math.cos(wd*t)+(z*w0/wd)*Math.sin(wd*t));}
  return 1-Math.exp(-w0*t)*(1+w0*t);
}
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;
  let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;
  return((t^t>>>14)>>>0)/4294967296;};}


const INK='#0c0e12', FG='#f0eee6', ACC='#d97757';
function vignette(){
  const grd=g.createRadialGradient(W/2,H/2,200,W/2,H/2,720);
  grd.addColorStop(0,'rgba(0,0,0,0)');grd.addColorStop(1,'rgba(0,0,0,.55)');
  g.fillStyle=grd;g.fillRect(0,0,W,H);
}


const SCENES=[
{from:0,to:4,draw(t){
  g.fillStyle=INK;g.fillRect(0,0,W,H);
  const zoom=1+spring(t-0.1,120,18)*0.07;
  g.save();g.translate(W/2,H/2);g.scale(zoom,zoom);g.translate(-W/2,-H/2);
  const r=spring(t-0.25,100,18);
  g.save();g.beginPath();g.rect(W/2-460,H/2-140,920*r,280);g.clip();
  g.fillStyle=FG;g.font='700 118px Georgia,serif';g.textAlign='center';g.textBaseline='middle';
  g.fillText('CINEMATIC',W/2,H/2-12);g.restore();
  g.fillStyle=ACC;g.fillRect(W/2-460,H/2+82,420*r,6);
  g.restore();vignette();
}},
{from:4,to:8,draw(t){
  g.fillStyle=INK;g.fillRect(0,0,W,H);
  const spot=spring(t-0.2,90,18);
  const grd=g.createRadialGradient(W/2,H/2,20,W/2,H/2,380);
  grd.addColorStop(0,'rgba(217,119,87,'+(0.22*spot)+')');grd.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=grd;g.fillRect(0,0,W,H);
  const r=spring(t-0.35,100,18);
  g.fillStyle=FG;g.font='700 74px Georgia';g.textAlign='center';g.textBaseline='middle';
  g.globalAlpha=r;g.fillText('SPOTLIGHT REVEAL',W/2,H/2);g.globalAlpha=1;
  vignette();
}},
{from:8,to:12,draw(t){
  g.fillStyle=INK;g.fillRect(0,0,W,H);
  const r=spring(t-0.2,100,18);
  g.fillStyle=ACC;g.font='700 150px Georgia';g.textAlign='center';g.textBaseline='middle';
  g.globalAlpha=r;g.fillText('2.1M',W/2,H/2-20);g.globalAlpha=1;
  g.fillStyle=FG;g.font='400 40px Inter';g.fillText('VIEWS',W/2,H/2+90);
  vignette();
}}
];

function draw(t){
  g.setTransform(1,0,0,1,0,0);
  g.clearRect(0,0,W,H);
  for(const s of SCENES){ if(t>=s.from&&t<s.to) s.draw(t-s.from); }
}
window.seek=(t)=>{draw(clamp(t,0,DUR));return true;};
if(!navigator.webdriver){
  const t0=performance.now();
  (function loop(){draw(((performance.now()-t0)/1000)%DUR);requestAnimationFrame(loop);})();
}
</script>
</body>
</html>
