<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>信号 · 连续推进 Continuous push</title>
<style>
  html,body{margin:0;height:100%;background:#0a0e17;overflow:hidden}
  #wrap{display:flex;align-items:center;justify-content:center;height:100%}
  canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="1280" height="720"></canvas></div>
<script>
/* ============================ FILM KIT ============================ */
const W=1280,H=720,DUR=15;
const g=document.getElementById('c').getContext('2d');
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(a,b,t)=>{t=clamp(t);t=t*t*(3-2*t);return lerp(a,b,t);};
const easeOutCubic=t=>1-Math.pow(1-t,3);
const easeInOutCubic=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const easeOutBack=t=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);};
function spring(t,k=170,d=26){
  if(t<=0)return 0;
  const w0=Math.sqrt(k),z=d/(2*w0);
  if(z<1){const wd=w0*Math.sqrt(1-z*z);
    return 1-Math.exp(-z*w0*t)*(Math.cos(wd*t)+(z*w0/wd)*Math.sin(wd*t));}
  return 1-Math.exp(-w0*t)*(1+w0*t);
}
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;
  let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;
  return((t^t>>>14)>>>0)/4294967296;};}
/* value noise on a seeded lattice */
function makeNoise(seed){
  const r=rng(seed),G=new Map();
  const at=(ix,iy)=>{const k=ix+','+iy;if(!G.has(k))G.set(k,r()*2-1);return G.get(k);};
  const fade=t=>t*t*(3-2*t);
  return(x,y)=>{
    const x0=Math.floor(x),y0=Math.floor(y),fx=fade(x-x0),fy=fade(y-y0);
    return lerp(lerp(at(x0,y0),at(x0+1,y0),fx),lerp(at(x0,y0+1),at(x0+1,y0+1),fx),fy);
  };
}
const noise=makeNoise(1337);
const C={ink:'#0a0e17',panel:'#121a2b',fg:'#eef2f7',muted:'#7f8ba0',cyan:'#45d1e6',warm:'#f0b95c',indigo:'#7c8cff'};
function rr(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();
}
/* ============================ WORLD LAYERS ============================ */
const PR=rng(20240922);
const PARTICLES=[];
for(let i=0;i<150;i++){
  const z=0.25+PR()*0.75;
  PARTICLES.push({x:PR()*W,y:PR()*H,z,sp:0.15+PR()*0.4,ph:PR()*6.28,r:0.5+z*1.6,
    hue:PR()<0.12?'warm':(PR()<0.2?'indigo':'cyan')});
}
function drawParticles(t,camX,camY,alpha=1){
  for(const p of PARTICLES){
    const dx=Math.sin(t*p.sp+p.ph)*14,dy=Math.cos(t*p.sp*0.8+p.ph)*10;
    const x=((p.x+dx-camX*p.z*1.4)%W+W)%W;
    const y=((p.y+dy-camY*p.z*1.4)%H+H)%H;
    const col=p.hue==='warm'?C.warm:p.hue==='indigo'?C.indigo:C.cyan;
    g.globalAlpha=p.z*0.55*alpha;g.fillStyle=col;
    g.beginPath();g.arc(x,y,p.r,0,6.28);g.fill();
  }g.globalAlpha=1;
}
function drawGrid(t,camX,camY,alpha=1){
  const gap=52,size=1.4;
  g.globalAlpha=0.5*alpha;
  const ox=(-camX*0.5)%gap,oy=(-camY*0.5)%gap;
  for(let x=ox;x<W;x+=gap)for(let y=oy;y<H;y+=gap){
    const b=0.35+0.3*noise(x*0.02,y*0.02+t*0.05);
    g.globalAlpha=b*alpha*0.5;g.fillStyle='#5b78a8';
    g.fillRect(x-size/2,y-size/2,size,size);
  }g.globalAlpha=1;
}
const GLYPH='01<>[]{};:=.+-*#$abcdef';
function drawChars(t,camX,camY,alpha=1){
  const cell=30,cols=Math.ceil(W/cell)+1,rows=Math.ceil(H/cell)+1;
  g.font='13px ui-monospace,Menlo,monospace';g.textAlign='center';g.textBaseline='middle';
  for(let i=0;i<cols;i++)for(let j=0;j<rows;j++){
    const x=i*cell+((-camX*0.4)%cell),y=j*cell+((-camY*0.4)%cell);
    const n=noise(i*0.35,j*0.35+t*0.12);
    if(n>0.15){
      g.globalAlpha=clamp(n)*0.5*alpha;g.fillStyle='#5fd6e6';
      g.fillText(GLYPH[Math.floor(Math.abs(n*997))%GLYPH.length],x,y);
    }
  }g.globalAlpha=1;
}
function drawGradient(t,camX,camY,alpha=1){
  const blobs=[[0.25,0.3,420,C.cyan,0.12],[0.75,0.7,520,C.indigo,0.12],[0.6,0.25,300,C.warm,0.08]];
  for(const [bx,by,r,col,a] of blobs){
    const x=bx*W+Math.sin(t*0.2+bx)*30-camX*0.3,y=by*H+Math.cos(t*0.16+by)*24-camY*0.3;
    const gr=g.createRadialGradient(x,y,0,x,y,r);
    gr.addColorStop(0,col);gr.addColorStop(1,'rgba(0,0,0,0)');
    g.globalAlpha=a*alpha/0.12;g.fillStyle=gr;g.fillRect(0,0,W,H);
  }g.globalAlpha=1;
}
function drawWorld(kind,t,camX,camY){
  g.fillStyle=C.ink;g.fillRect(0,0,W,H);
  const gr=g.createRadialGradient(W*0.5,H*0.45,80,W*0.5,H*0.5,760);
  gr.addColorStop(0,'#0e1525');gr.addColorStop(1,'#070a12');
  g.fillStyle=gr;g.fillRect(0,0,W,H);
  if(kind==='particle-field')drawParticles(t,camX,camY);
  else if(kind==='grid')drawGrid(t,camX,camY);
  else if(kind==='character-field')drawChars(t,camX,camY);
  else if(kind==='gradient-field')drawGradient(t,camX,camY);
  else drawParticles(t,camX,camY,0.4);
}
function vignette(){
  const gr=g.createRadialGradient(W/2,H/2,240,W/2,H/2,760);
  gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,.5)');
  g.fillStyle=gr;g.fillRect(0,0,W,H);
}
function grain(t){
  const r=rng(99+Math.floor(t*12));
  g.globalAlpha=0.05;
  for(let i=0;i<70;i++){
    g.fillStyle=r()<0.5?'#fff':'#000';
    g.fillRect(r()*W,r()*H,1.2,1.2);
  }g.globalAlpha=1;
}
/* ============================ SUBJECTS ============================ */
function drawCursor(x,y,scale=1){
  g.save();g.translate(x,y);g.scale(scale,scale);
  g.beginPath();g.moveTo(0,0);g.lineTo(0,16);g.lineTo(4.5,12);g.lineTo(7,19);g.lineTo(9.5,18);g.lineTo(7,11);g.lineTo(12,11);
  g.closePath();g.fillStyle='#fff';g.fill();g.lineWidth=0.8;g.strokeStyle='#000';g.stroke();
  g.restore();
}
/* scene 1: big word hook, right third */
function scWord(t){
  const camX=Math.sin(t*0.4)*14,camY=Math.cos(t*0.3)*10;
  drawWorld('particle-field',t,camX,camY);
  const zoom=1+spring(t*0-t,0)-spring(t-0.0,0); // noop, kept
  const cx=800,cy=330;
  const settle=spring(t-0.0,120,16);
  g.save();
  g.translate(cx,cy);
  const z=1+ (1-spring(t-0.1,100,16))*0.08;
  g.scale(z,z);
  g.font='800 168px Inter,system-ui,sans-serif';g.textAlign='center';g.textBaseline='middle';
  /* mask reveal: fully present at t=0 */
  const rw=lerp(W*0.9,W*0.9,1);
  g.save();g.beginPath();g.rect(-W*0.9,-130,W*1.8,260);g.clip();
  g.fillStyle=C.fg;g.fillText('SIGNAL',0,0);
  g.restore();
  /* accent underline */
  const ul=spring(t-0.15,120,18);
  g.fillStyle=C.cyan;g.fillRect(-260,108,520*ul,7);
  g.fillStyle=C.warm;g.fillRect(-260+520*ul,108,10,7);
  /* small number */
  g.font='700 40px Inter';g.fillStyle=C.muted;g.fillText('实时 · 98.4%',0,168);
  g.restore();
}
/* scene 2: dashboard assembles, left third */
function scDash(t){
  const camX=40+Math.sin(t*0.5)*12,camY=Math.cos(t*0.4)*8;
  drawWorld('grid',t,camX,camY);
  const x=240,y=180,pw=460,ph=330;
  const r=spring(t-0.1,120,18);
  g.save();g.globalAlpha=clamp(r*1.2);
  g.translate(x+pw/2,y+ph/2);g.scale(0.94+0.06*r,0.94+0.06*r);g.translate(-(x+pw/2),-(y+ph/2));
  g.fillStyle='rgba(8,12,22,0.55)';g.shadowColor='rgba(0,0,0,.5)';g.shadowBlur=30;g.shadowOffsetY=12;
  rr(x,y,pw,ph,16);g.fill();g.shadowBlur=0;g.shadowOffsetY=0;g.shadowColor='transparent';
  g.strokeStyle='rgba(120,150,200,.18)';g.lineWidth=1;rr(x,y,pw,ph,16);g.stroke();
  /* header */
  let d=spring(t-0.3,140,20);
  g.fillStyle=C.cyan;g.globalAlpha=clamp(r*1.2)*d;rr(x+24,y+22,8,22,3);g.fill();
  g.fillStyle=C.fg;g.font='700 22px Inter';g.textAlign='left';g.fillText('监控概览',x+42,y+41);
  g.fillStyle=C.muted;g.font='500 14px Inter';g.fillText('实时同步',x+24,y+80);
  /* rows */
  for(let i=0;i<4;i++){
    const rr2=spring(t-0.45-i*0.12,140,20);
    g.globalAlpha=clamp(r*1.2)*rr2;
    const ry=y+104+i*50;
    g.fillStyle='rgba(120,150,200,.12)';rr(x+24,ry,pw-48,40,10);g.fill();
    g.fillStyle=i===1?C.cyan:C.fg;g.font='600 16px Inter';g.fillText(['请求','延迟','错误','吞吐'][i],x+42,ry+25);
    g.fillStyle=C.muted;g.font='500 14px Inter';g.textAlign='right';
    g.fillText(['1,204/s','38 ms','0.02%','86 MB'][i],x+pw-40,ry+25);g.textAlign='left';
  }
  g.restore();
}
/* scene 3: chart draws, center */
function scChart(t){
  const camX=Math.sin(t*0.45)*10,camY=Math.cos(t*0.35)*8;
  drawWorld('character-field',t,camX,camY);
  const cx=640,cy=380;
  g.save();g.translate(cx,cy);
  const panel=spring(t-0.05,110,16);
  g.globalAlpha=clamp(panel*1.2);
  g.fillStyle='rgba(8,12,22,0.5)';g.shadowBlur=30;g.shadowColor='rgba(0,0,0,.5)';g.shadowOffsetY=10;
  rr(-380,-200,760,370,16);g.fill();g.shadowBlur=0;g.shadowOffsetY=0;g.shadowColor='transparent';
  g.strokeStyle='rgba(120,150,200,.15)';rr(-380,-200,760,370,16);g.stroke();
  /* axis */
  g.strokeStyle='rgba(120,150,200,.25)';g.lineWidth=1;
  g.beginPath();g.moveTo(-340,140);g.lineTo(340,140);g.moveTo(-340,140);g.lineTo(-340,-160);g.stroke();
  /* line path */
  const pts=[];
  for(let i=0;i<=10;i++){const x=-340+i*68;const y=120-(noise(i*0.7,7)*0.5+0.5)*240;pts.push([x,y]);}
  const draw=spring(t-0.3,90,15);
  g.save();g.beginPath();g.rect(-340,-180,680*draw,340);g.clip();
  g.beginPath();g.moveTo(pts[0][0],pts[0][1]);
  for(const p of pts)g.lineTo(p[0],p[1]);
  g.strokeStyle=C.cyan;g.lineWidth=3;g.stroke();
  /* area */
  g.lineTo(pts[pts.length-1][0],140);g.lineTo(pts[0][0],140);g.closePath();
  const ag=g.createLinearGradient(0,-160,0,140);ag.addColorStop(0,'rgba(69,209,230,.28)');ag.addColorStop(1,'rgba(69,209,230,0)');
  g.fillStyle=ag;g.fill();
  g.restore();
  /* points */
  for(let i=0;i<pts.length;i++){
    const ap=spring(t-0.5-i*0.05,140,18);
    if(ap>0){g.globalAlpha=ap;g.fillStyle='#fff';g.beginPath();g.arc(pts[i][0],pts[i][1],3.5,0,6.28);g.fill();}
  }
  g.globalAlpha=1;g.fillStyle=C.fg;g.font='700 20px Inter';g.textAlign='left';g.fillText('性能趋势',-340,-170);
  g.restore();
}
/* scene 4: big number */
function scNumber(t){
  const camX=Math.sin(t*0.5)*12,camY=Math.cos(t*0.35)*9;
  drawWorld('gradient-field',t,camX,camY);
  const cx=800,cy=350;
  g.save();g.translate(cx,cy);
  const val=clamp(spring(t-0.2,90,15));
  const n=(98.4*val).toFixed(1);
  g.font='800 176px Inter';g.textAlign='center';g.textBaseline='middle';
  g.fillStyle=C.fg;g.fillText(n+'%',0,0);
  const set=spring(t-0.9,120,16);
  g.globalAlpha=set;g.font='600 30px Inter';g.fillStyle=C.cyan;g.fillText('准确率',0,120);
  g.fillStyle=C.warm;g.font='500 22px Inter';g.fillText('较上周 +2.3%',0,165);
  g.restore();
}
/* scene 5: feature card + cursor click, left */
function scFeature(t){
  const camX=50+Math.sin(t*0.5)*10,camY=Math.cos(t*0.35)*8;
  drawWorld('grid',t,camX,camY);
  const x=220,y=200,pw=480,ph=300;
  const r=spring(t-0.1,120,18);
  g.save();g.globalAlpha=clamp(r*1.2);g.translate(x+pw/2,y+ph/2);g.scale(0.94+0.06*r,0.94+0.06*r);g.translate(-(x+pw/2),-(y+ph/2));
  g.fillStyle='rgba(8,12,22,.55)';g.shadowBlur=28;g.shadowColor='rgba(0,0,0,.5)';g.shadowOffsetY=12;rr(x,y,pw,ph,16);g.fill();g.shadowBlur=0;g.shadowOffsetY=0;g.shadowColor='transparent';
  g.strokeStyle='rgba(120,150,200,.16)';rr(x,y,pw,ph,16);g.stroke();
  g.fillStyle=C.fg;g.font='700 24px Inter';g.textAlign='left';g.fillText('一键发布',x+28,y+48);
  g.fillStyle=C.muted;g.font='500 16px Inter';g.fillText('选择环境，自动完成部署',x+28,y+82);
  /* environment chips */
  const cp=spring(t-0.35,150,20);
  g.globalAlpha=clamp(r*1.2)*cp;
  const envs=['production','staging','development'];
  for(let k=0;k<envs.length;k++){
    const cx0=x+28,cy0=y+100,cw0=136,ch0=32,ox=k*(cw0+10);
    g.fillStyle=k===0?'rgba(69,209,230,.18)':'rgba(120,150,200,.10)';
    g.strokeStyle=k===0?'rgba(69,209,230,.55)':'rgba(120,150,200,.22)';
    rr(cx0+ox,cy0,cw0,ch0,9);g.fill();g.stroke();
    g.fillStyle=k===0?C.cyan:C.muted;g.font='600 13px Inter';g.textAlign='center';
    g.fillText(envs[k],cx0+ox+cw0/2,cy0+21);g.textAlign='left';
  }
  /* button: idle -> deploying -> done */
  const clicked=t>0.95;
  const bp=spring(t-0.5,140,20);
  g.globalAlpha=clamp(r*1.2)*bp;
  const bx=x+28,by=y+150,bw=200,bh=50;
  const stages=['构建镜像','推送仓库','灰度上线'];
  if(!clicked){
    g.fillStyle=C.cyan;rr(bx,by,bw,bh,12);g.fill();
    g.fillStyle='#04121a';g.font='700 17px Inter';g.textAlign='center';g.fillText('立即部署',bx+bw/2,by+32);g.textAlign='left';
  }else{
    const dt2=(t-0.95);
    const done=dt2>1.1;
    g.fillStyle=done?'rgba(110,210,160,.18)':'rgba(120,150,200,.10)';
    g.strokeStyle=done?'rgba(110,210,160,.6)':'rgba(120,150,200,.25)';
    rr(bx,by,bw,bh,12);g.fill();g.stroke();
    g.fillStyle=done?'#76d9a5':C.muted;g.font='700 15px Inter';g.textAlign='center';
    g.fillText(done?'✓ 已发布到 production':stages[Math.min(2,Math.floor(dt2/0.36))]+'…',bx+bw/2,by+31);g.textAlign='left';
    /* progress bar while deploying */
    if(!done){const pgr=clamp(dt2/1.1);g.fillStyle=C.cyan;rr(bx+8,by+bh-6,(bw-16)*pgr,3,2);g.fill();}
  }
  /* deploy log footer */
  const logs=clicked?['$ deploy --env production','→ 构建完成 0.8s','→ 推送至 registry','→ 灰度 10% → 100%','✓ 上线成功']:[];
  for(let k=0;k<logs.length;k++){
    const lp=clamp((t-0.95-k*0.22)/0.15);
    g.globalAlpha=clamp(r*1.2)*lp;
    g.fillStyle=k===logs.length-1?'#76d9a5':'rgba(150,175,215,.7)';g.font='500 13px Inter';g.textAlign='left';
    g.fillText(logs[k],x+28,y+232+k*14);
  }
  g.restore();
  /* cursor moves to button and clicks */
  const move=clamp(t/0.7);
  const sx=900,sy=520,tx=220+28+160,ty=200+150+25;
  const mx=smooth(sx,tx,move),my=smooth(sy,ty,move);
  const click=clamp((t-0.9)/0.12);
  if(!clicked)drawCursor(mx,my,click?0.85:1);
  if(clicked){g.globalAlpha=0.5;g.fillStyle='#fff';g.beginPath();g.arc(tx,ty,10+Math.sin(t*24)*2.5,0,6.28);g.fill();g.globalAlpha=1;}
}
/* scene 6: particles converge to logo */
function scLogo(t){
  const camX=Math.sin(t*0.3)*10,camY=Math.cos(t*0.25)*8;
  const cx=640,cy=330;
  const conv=clamp(spring(t-0.2,80,14));
  g.save();g.globalAlpha=0.9*(1-conv*0.95);drawWorld('particle-field',t,camX,camY);g.restore();
  const R=70;
  const targets=[];
  for(let i=0;i<40;i++){const a=i/40*6.28;targets.push([cx+Math.cos(a)*R,cy+Math.sin(a)*R]);}
  for(let i=0;i<6;i++){const a=i/6*6.28;targets.push([cx+Math.cos(a)*34,cy+Math.sin(a)*34]);}
  const rr2=rng(555);
  for(let i=0;i<targets.length;i++){
    const p=PARTICLES[(i*3)%PARTICLES.length];
    const startX=p.x+Math.sin(t*0.4+p.ph)*20,startY=p.y+Math.cos(t*0.3+p.ph)*14;
    const lag=clamp(conv*1.25-i*0.005);
    const x=lerp(startX,targets[i][0],lag),y=lerp(startY,targets[i][1],lag);
    g.fillStyle=i%5?C.cyan:C.warm;g.globalAlpha=0.5+lag*0.5;
    g.beginPath();g.arc(x,y,1.4+lag*1.2,0,6.28);g.fill();
  }
  g.globalAlpha=spring(t-0.9,120,16);
  g.strokeStyle=C.fg;g.lineWidth=3;g.beginPath();g.arc(cx,cy,R,0,6.28);g.stroke();
  g.fillStyle=C.fg;g.font='800 40px Inter';g.textAlign='center';g.textBaseline='middle';g.fillText('✦',cx,cy);
  g.font='700 30px Inter';g.fillText('Signal',cx,cy+130);
  g.fillStyle=C.muted;g.font='500 18px Inter';g.fillText('看见每一个信号',cx,cy+168);
  g.globalAlpha=1;
}
/* ============================ SCENES + TRANSITIONS ============================ */
const SCENES=[
  {from:0,to:2.5,draw:scWord,out:'push-through'},
  {from:2.5,to:5,draw:scDash,out:'match-cut'},
  {from:5,to:7.5,draw:scChart,out:'hard-cut'},
  {from:7.5,to:10,draw:scNumber,out:'whip-cut'},
  {from:10,to:12.5,draw:scFeature,out:'push-through'},
  {from:12.5,to:15,draw:scLogo,out:'none'},
];
function drawWrapped(i,lt,zoom,alpha,blur,dx){
  g.save();
  g.globalAlpha=alpha;
  if(blur>0.2)g.filter='blur('+blur+'px)';
  g.translate(dx,0);
  g.translate(W/2,H/2);g.scale(zoom,zoom);g.translate(-W/2,-H/2);
  SCENES[i].draw(lt);
  g.restore();
}
function draw(t){
  g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,W,H);
  let i=SCENES.findIndex(s=>t>=s.from&&t<s.to);
  if(i<0)i=SCENES.length-1;
  const s=SCENES[i];
  const lt=t-s.from;
  const seamLen=0.32;
  const into=t-s.from; // time since shot start
  /* first frame complete rule */
  if(i===0){drawWrapped(0,lt,1,1,0,0);vignette();grain(t);return;}
  /* draw current scene; if near a seam, blend with previous according to type */
  const prevType=SCENES[i-1].out;
  if(into<seamLen && prevType!=='hard-cut'){
    const p=into/seamLen;
    if(prevType==='push-through'){
      const e=easeInOutCubic(p);
      drawWrapped(i-1,SCENES[i-1].to-SCENES[i-1].from,1+0.1*e,1-e,5*e,-30*e);
      drawWrapped(i,0,1.1-0.1*e,e,5*(1-e),60*(1-e));
    }else if(prevType==='match-cut'){
      const e=easeOutCubic(p);
      drawWrapped(i-1,SCENES[i-1].to-SCENES[i-1].from,1,1,0,0);
      drawWrapped(i,0,1.05-0.05*e,e,3*(1-e),0);
    }else if(prevType==='whip-cut'){
      const e=easeInOutCubic(p);
      drawWrapped(i-1,SCENES[i-1].to-SCENES[i-1].from,1.02,1-p,14*(1-p),-W*0.6*e);
      drawWrapped(i,0,1.02,e,14*(1-e),W*0.6*(1-e));
    }
  }else{
    drawWrapped(i,lt,1,1,0,0);
  }
  /* hard-cut flash-free: just a tiny alpha pop */
  if(prevType==='hard-cut' && into<0.09){
    drawWrapped(i,lt,1,clamp(into/0.09),0,0);
  }
  vignette();grain(t);
}
window.seek=(t)=>{t=clamp(t,0,DUR);draw(t);window.__auto=false;window.__curT=t;return true;};
window.play=(t0)=>{if(typeof t0==='number')window.__curT=t0;window.__auto=true;};
window.pause=()=>{window.__auto=false;};
window.getTime=()=>window.__curT||0;
window.DUR=DUR;
let __curT=0,lastNow=performance.now();
if(!navigator.webdriver){
  (function loop(){
    const now=performance.now();
    if(window.__auto!==false){__curT=(__curT+(now-lastNow)/1000)%DUR;window.__curT=__curT;draw(__curT);}
    lastNow=now;
    requestAnimationFrame(loop);
  })();
}
</script>
