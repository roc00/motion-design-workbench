<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>粉彩玩趣 · Pastel playful</title>
<style>
  html,body{margin:0;height:100%;background:#0a0a0a;overflow:hidden}
  #wrap{display:flex;align-items:center;justify-content:center;height:100%}
  canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="1280" height="720"></canvas></div>
<script>
const W=1280,H=720,DUR=12;
const g=document.getElementById('c').getContext('2d');

const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
function spring(t,k=170,d=26){
  if(t<=0)return 0;
  const w0=Math.sqrt(k),z=d/(2*w0);
  if(z<1){const wd=w0*Math.sqrt(1-z*z);
    return 1-Math.exp(-z*w0*t)*(Math.cos(wd*t)+(z*w0/wd)*Math.sin(wd*t));}
  return 1-Math.exp(-w0*t)*(1+w0*t);
}
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;
  let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;
  return((t^t>>>14)>>>0)/4294967296;};}


const BG='#fdf3f0', INK='#4a4458';
const P=['#ffd6e0','#c9e7ff','#d8f3dc','#ffe8b0','#e7d6ff'];


const SCENES=[
{from:0,to:4,draw(t){
  g.fillStyle=BG;g.fillRect(0,0,W,H);
  // 贴纸弹跳
  const coords=[[300,H/2],[640,H/2],[980,H/2]];
  coords.forEach(([x,y],i)=>{
    const r=spring(t-0.1-i*0.2,180,14);
    const s=0.5+0.5*r;
    g.save();g.translate(x,y);g.scale(s,s);
    g.fillStyle=P[i];g.beginPath();g.arc(0,0,90,0,7);g.fill();
    g.fillStyle=INK;g.font='900 56px Arial';g.textAlign='center';g.textBaseline='middle';
    g.fillText(i+1,0,0);g.restore();
  });
}},
{from:4,to:8,draw(t){
  g.fillStyle=BG;g.fillRect(0,0,W,H);
  const r=spring(t-0.2,140,16);
  g.save();g.translate(W/2,H/2);g.scale(0.6+0.4*r,0.6+0.4*r);
  g.fillStyle=P[3];g.beginPath();g.roundRect(-180,-120,360,240,40);g.fill();
  g.fillStyle=INK;g.font='900 70px Arial';g.textAlign='center';g.textBaseline='middle';
  g.fillText('SPRING',0,0);g.restore();
}},
{from:8,to:12,draw(t){
  g.fillStyle=BG;g.fillRect(0,0,W,H);
  const r=spring(t-0.2,120,18);
  g.fillStyle=INK;g.font='900 74px Arial';g.textAlign='center';g.textBaseline='middle';
  g.globalAlpha=r;g.fillText('Playful & Soft',W/2,H/2);g.globalAlpha=1;
}}
];

function draw(t){
  g.setTransform(1,0,0,1,0,0);
  g.clearRect(0,0,W,H);
  for(const s of SCENES){ if(t>=s.from&&t<s.to) s.draw(t-s.from); }
}
window.seek=(t)=>{draw(clamp(t,0,DUR));return true;};
if(!navigator.webdriver){
  const t0=performance.now();
  (function loop(){draw(((performance.now()-t0)/1000)%DUR);requestAnimationFrame(loop);})();
}
</script>
</body>
</html>
