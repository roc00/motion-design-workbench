<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>问题→消失 · Problem → gone</title>
<style>
  html,body{margin:0;height:100%;background:#0a0a0a;overflow:hidden}
  #wrap{display:flex;align-items:center;justify-content:center;height:100%}
  canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="1280" height="720"></canvas></div>
<script>
const W=1280,H=720,DUR=12;
const g=document.getElementById('c').getContext('2d');

const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
function spring(t,k=170,d=26){
  if(t<=0)return 0;
  const w0=Math.sqrt(k),z=d/(2*w0);
  if(z<1){const wd=w0*Math.sqrt(1-z*z);
    return 1-Math.exp(-z*w0*t)*(Math.cos(wd*t)+(z*w0/wd)*Math.sin(wd*t));}
  return 1-Math.exp(-w0*t)*(1+w0*t);
}
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;
  let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;
  return((t^t>>>14)>>>0)/4294967296;};}

const BG='#f6f6f4', PAIN='#b5402f', OK='#2f9e6e', FG='#1a1a1a';


function world(T){
  g.fillStyle=BG;g.fillRect(0,0,W,H);
  g.textAlign='center';g.textBaseline='middle';
  if(T<5){
    const s=spring(T-0.2,90,16);
    g.fillStyle=PAIN;g.font='900 80px Arial';
    g.globalAlpha=s;g.fillText('痛点 PROBLEM',W/2,H/2);g.globalAlpha=1;
  }else{
    // 产品出现，痛点被擦除
    const k=spring(T-5,120,16);
    g.fillStyle=OK;g.fillRect(0,H/2-160,W*k,320);
    g.fillStyle='#fff';g.font='900 80px Arial';
    g.save();g.beginPath();g.rect(0,H/2-160,W*k,320);g.clip();
    g.fillText('已解决',W/2,H/2);g.restore();
  }
}
const SCENES=[
  {from:0,to:6,draw(t){world(t);}},
  {from:6,to:12,draw(t){world(t+6);}}
];

function draw(t){
  g.setTransform(1,0,0,1,0,0);
  g.clearRect(0,0,W,H);
  for(const s of SCENES){ if(t>=s.from&&t<s.to) s.draw(t-s.from); }
}
window.seek=(t)=>{draw(clamp(t,0,DUR));return true;};
if(!navigator.webdriver){
  const t0=performance.now();
  (function loop(){draw(((performance.now()-t0)/1000)%DUR);requestAnimationFrame(loop);})();
}
</script>
</body>
</html>
