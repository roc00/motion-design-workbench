<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>复古模拟 · Retro analog</title>
<style>
  html,body{margin:0;height:100%;background:#0a0a0a;overflow:hidden}
  #wrap{display:flex;align-items:center;justify-content:center;height:100%}
  canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="1280" height="720"></canvas></div>
<script>
const W=1280,H=720,DUR=12;
const g=document.getElementById('c').getContext('2d');

const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
function spring(t,k=170,d=26){
  if(t<=0)return 0;
  const w0=Math.sqrt(k),z=d/(2*w0);
  if(z<1){const wd=w0*Math.sqrt(1-z*z);
    return 1-Math.exp(-z*w0*t)*(Math.cos(wd*t)+(z*w0/wd)*Math.sin(wd*t));}
  return 1-Math.exp(-w0*t)*(1+w0*t);
}
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;
  let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;
  return((t^t>>>14)>>>0)/4294967296;};}


const DARK='#0a0f0c', FG='#9fd6a8';
function scanlines(a){g.fillStyle='rgba(0,0,0,'+a+')';
  for(let y=0;y<H;y+=4)g.fillRect(0,y,W,2);}


const SCENES=[
{from:0,to:4,draw(t){
  // CRT 开机：横线拉伸
  const p=spring(t-0.1,90,18);
  g.fillStyle='#000';g.fillRect(0,0,W,H);
  g.save();g.translate(W/2,H/2);g.scale(1,p);g.translate(-W/2,-H/2);
  g.fillStyle=DARK;g.fillRect(0,0,W,H);
  g.fillStyle=FG;g.font='900 90px monospace';g.textAlign='center';g.textBaseline='middle';
  g.fillText('RETRO',W/2,H/2);g.restore();
  scanlines(0.35);
}},
{from:4,to:8,draw(t){
  g.fillStyle=DARK;g.fillRect(0,0,W,H);
  // 色差
  const r=spring(t-0.2,90,18);
  g.font='900 90px monospace';g.textAlign='center';g.textBaseline='middle';
  g.globalAlpha=0.8;g.fillStyle='#ff2e88';g.fillText('ANALOG',W/2-6,H/2);
  g.fillStyle='#2ef1ff';g.fillText('ANALOG',W/2+6,H/2);g.globalAlpha=1;
  g.fillStyle=FG;g.globalAlpha=r;g.fillText('ANALOG',W/2,H/2);g.globalAlpha=1;
  scanlines(0.3);
}},
{from:8,to:12,draw(t){
  g.fillStyle=DARK;g.fillRect(0,0,W,H);
  const r=spring(t-0.2,90,18);
  // 噪点
  const rr=rng(21);
  for(let i=0;i<400;i++){g.fillStyle='rgba(159,214,168,'+(0.4*rr())+')';
    g.fillRect(rr()*W,rr()*H,3,3);}
  g.fillStyle=FG;g.font='900 60px monospace';g.textAlign='center';g.textBaseline='middle';
  g.globalAlpha=r;g.fillText('NO SIGNAL',W/2,H/2);g.globalAlpha=1;
  scanlines(0.3);
}}
];

function draw(t){
  g.setTransform(1,0,0,1,0,0);
  g.clearRect(0,0,W,H);
  for(const s of SCENES){ if(t>=s.from&&t<s.to) s.draw(t-s.from); }
}
window.seek=(t)=>{draw(clamp(t,0,DUR));return true;};
if(!navigator.webdriver){
  const t0=performance.now();
  (function loop(){draw(((performance.now()-t0)/1000)%DUR);requestAnimationFrame(loop);})();
}
</script>
</body>
</html>
