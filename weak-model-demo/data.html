<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>data · 数据故事（弱模型成片）</title>
<style>
  html,body{margin:0;height:100%;background:#141411;overflow:hidden}
  #wrap{display:flex;align-items:center;justify-content:center;height:100%}
  canvas{display:block;height:100%}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="1080" height="1920"></canvas></div>
<script>
const W=1080,H=1920,DUR=15;
const g=document.getElementById('c').getContext('2d');
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
function spring(t,k=170,d=26){
  if(t<=0)return 0;
  const w0=Math.sqrt(k),z=d/(2*w0);
  if(z<1){const wd=w0*Math.sqrt(1-z*z);
    return 1-Math.exp(-z*w0*t)*(Math.cos(wd*t)+(z*w0/wd)*Math.sin(wd*t));}
  return 1-Math.exp(-w0*t)*(1+w0*t);
}
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;
  let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;
  return((t^t>>>14)>>>0)/4294967296;};}
function rrPath(g,x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  g.beginPath();
  g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();
}

const PAPER='#efece2', INK='#141411', ACCENT='#ff4d1f', GRY='#c9c5b8', WHITE='#faf8f2';
const MONO='"JetBrains Mono","SF Mono",Menlo,monospace';
const CJK='"PingFang SC","Microsoft YaHei",'+MONO;

/* ---------- 背景：奶油纸 + 细网格（不渐变） ---------- */
function bg(T){
  g.fillStyle=PAPER;g.fillRect(0,0,W,H);
  g.strokeStyle='rgba(20,20,17,0.07)';g.lineWidth=1;
  const gap=60;
  g.beginPath();
  for(let x=0;x<=W;x+=gap){g.moveTo(x,0);g.lineTo(x,H);}
  for(let y=0;y<=H;y+=gap){g.moveTo(0,y);g.lineTo(W,y);}
  g.stroke();
  // 顶部粗黑条
  g.fillStyle=INK;g.fillRect(0,0,W,18);
  g.fillStyle=INK;g.fillRect(0,H-18,W,18);
}

/* 粗边框 + 硬投影（brutalist 标志） */
function brutal(x,y,w,h,r,fill){
  g.fillStyle=INK;rrPath(g,x+12,y+12,w,h,r);g.fill();
  g.fillStyle=fill;rrPath(g,x,y,w,h,r);g.fill();
  g.strokeStyle=INK;g.lineWidth=6;g.stroke();
}

/* ---------- Scene 1 · 钩子：旧数据 ---------- */
function d1(t){
  g.textAlign='center';g.textBaseline='middle';
  // 粗黑标签
  const tag=spring(t-0.1,160,18);
  g.save();g.translate(W*0.5,H*0.24);g.scale(tag,tag);
  g.fillStyle=INK;rrPath(g,-200,-44,400,88,0);g.fill();
  g.fillStyle=PAPER;g.font='700 38px '+MONO;g.fillText('DAILY / 每天',0,2);
  g.restore();
  // 大数字
  const a=spring(t-0.3,150,18);
  g.save();g.translate(W*0.5,H*0.43);g.scale(0.5+0.5*a,0.5+0.5*a);
  g.fillStyle=INK;g.font='900 240px '+MONO;g.fillText('3h',0,0);
  g.restore();
  // 中文说明
  const b=spring(t-0.7,140,18);
  g.globalAlpha=clamp(b*1.3);
  g.fillStyle=ACCENT;g.font='900 96px '+CJK;
  g.fillText('都在对齐上',W*0.5,H*0.58);
  g.fillStyle=INK;g.font='600 44px '+CJK;
  g.fillText('团队反复拖拽、返工…',W*0.5,H*0.68);
  g.globalAlpha=1;
}

/* ---------- Scene 2 · 数据面板出现 ---------- */
function d2(t){
  g.textAlign='center';g.textBaseline='middle';
  const px=W*0.5-400, py=H*0.28, pw=800, ph=900;
  const a=spring(t-0.1,150,16);
  g.save();
  g.globalAlpha=clamp(a*1.4);
  g.translate(W*0.5,H*0.28+900/2+(1-a)*80);
  g.scale(0.85+0.15*a,0.85+0.15*a);
  g.translate(-W*0.5,-(H*0.28+900/2));
  brutal(px,py,pw,ph,8,WHITE);
  // 面板标题
  g.fillStyle=INK;g.textAlign='left';g.font='800 48px '+MONO;
  g.fillText('ALIGN TIME',px+40,py+90);
  g.fillStyle=ACCENT;g.font='700 36px '+MONO;
  g.fillText('对齐耗时 / 分钟',px+40,py+140);
  // 基线（待柱状图）
  const base=py+ph-120;
  g.strokeStyle=INK;g.lineWidth=4;
  g.beginPath();g.moveTo(px+40,base);g.lineTo(px+pw-40,base);g.stroke();
  g.restore();
}

/* ---------- Scene 3 · 柱状图对比（之前 vs 之后） ---------- */
function d3(t){
  g.textAlign='center';g.textBaseline='middle';
  const px=W*0.5-400, py=H*0.28, pw=800, ph=900;
  brutal(px,py,pw,ph,8,WHITE);
  g.fillStyle=INK;g.textAlign='left';g.font='800 48px '+MONO;
  g.fillText('ALIGN TIME',px+40,py+90);
  const base=py+ph-120;
  g.strokeStyle=INK;g.lineWidth=4;
  g.beginPath();g.moveTo(px+40,base);g.lineTo(px+pw-40,base);g.stroke();
  // 柱 A（之前 180min，高）
  const sA=spring(t-0.15,150,16);
  const wbar=200;
  const hA=600*sA;
  const ax=px+200;
  g.fillStyle=GRY;g.fillRect(ax-wbar/2,base-hA,wbar,hA);
  g.strokeStyle=INK;g.lineWidth=5;g.strokeRect(ax-wbar/2,base-hA,wbar,hA);
  g.fillStyle=INK;g.font='800 56px '+MONO;
  g.fillText(Math.round(180*sA)+'',ax,base-hA-44);
  g.font='700 34px '+CJK;
  g.fillText('使用前',ax,base+50);
  // 柱 B（之后 12min，矮）
  const sB=spring(t-0.95,150,16);
  const hB=Math.max(40,600*(12/180)*sB);
  const bx=px+pw-200;
  g.fillStyle=ACCENT;g.fillRect(bx-wbar/2,base-hB,wbar,hB);
  g.strokeStyle=INK;g.lineWidth=5;g.strokeRect(bx-wbar/2,base-hB,wbar,hB);
  g.fillStyle=ACCENT;g.font='800 56px '+MONO;
  g.fillText(Math.round(12*sB)+'',bx,base-hB-44);
  g.fillStyle=INK;g.font='700 34px '+CJK;
  g.fillText('使用后',bx,base+50);
}

/* ---------- Scene 4 · 活数字：结论 ---------- */
function d4(t){
  g.textAlign='center';g.textBaseline='middle';
  // 粗黑大数字框
  const a=spring(t-0.15,140,16);
  g.save();
  g.translate(W*0.5,H*0.42);g.scale(0.8+0.2*a,0.8+0.2*a);
  brutal(-360,-200,720,400,10,INK);
  // 计数 -93%
  const val=93*spring(t-0.3,110,14);
  g.fillStyle=ACCENT;g.font='900 200px '+MONO;g.textAlign='center';g.textBaseline='middle';
  g.fillText('-'+Math.round(val)+'%',0,10);
  g.restore();
  g.fillStyle=INK;g.font='900 60px '+CJK;g.textAlign='center';
  g.fillText('对齐耗时减少',W*0.5,H*0.62);
  const b=spring(t-0.8,130,16);
  g.globalAlpha=clamp(b*1.3);
  g.fillStyle=ACCENT;g.font='800 48px '+MONO;
  g.fillText('15x FASTER',W*0.5,H*0.7);
  g.globalAlpha=1;
}

/* ---------- Scene 5 · logo + 结论 ---------- */
function d5(t){
  g.textAlign='center';g.textBaseline='middle';
  const a=spring(t-0.15,150,16);
  g.save();g.translate(W*0.5,H*0.34);g.scale(0.8+0.2*a,0.8+0.2*a);
  // logo：粗黑方块 + 两个眼睛
  brutal(-90,-90,180,180,12,ACCENT);
  g.fillStyle=INK;
  g.beginPath();g.arc(-32,-10,16,0,7);g.fill();
  g.beginPath();g.arc(32,-10,16,0,7);g.fill();
  g.restore();
  g.fillStyle=INK;g.font='900 110px '+MONO;
  g.fillText('Doubao',W*0.5,H*0.48);
  g.fillStyle=INK;g.font='700 52px '+CJK;
  g.fillText('让数据，自己说话',W*0.5,H*0.56);
  // CTA
  const b=spring(t-0.6,140,18);
  g.save();g.translate(W*0.5,H*0.68);g.scale(0.9+0.1*b,0.9+0.1*b);
  brutal(-210,-54,420,108,8,INK);
  g.fillStyle=PAPER;g.font='800 44px '+CJK;g.fillText('查看完整报告',0,2);
  g.restore();
}

/* ---------- 场景时间轴 ---------- */
const SCENES=[
  {from:0,to:2.8,draw:d1},
  {from:2.8,to:5.3,draw:d2},
  {from:5.3,to:8.5,draw:d3},
  {from:8.5,to:11.3,draw:d4},
  {from:11.3,to:14,draw:d5},
];

/* 相机：轻微呼吸（brutalist 克制） */
function camera(T){
  return {zoom:1+Math.sin(T*0.9)*0.004, x:0, y:0};
}
function draw(T){
  bg(T);
  const endOut=spring(T-14.2,100,16);
  const cam=camera(T);
  g.save();
  g.translate(W/2,H/2);g.scale(cam.zoom,cam.zoom);
  g.translate(-W/2,-H/2);
  g.save();g.globalAlpha=1-endOut;
  for(const s of SCENES){if(T>=s.from&&T<s.to)s.draw(T-s.from);}
  g.restore();
  g.restore();
}
window.seek=(t)=>{draw(clamp(t,0,DUR));return true;};
if(!navigator.webdriver){
  const t0=performance.now();
  (function loop(){
    if(window.__stop)return;
    draw(((performance.now()-t0)/1000)%DUR);
    requestAnimationFrame(loop);
  })();
}
</script>
</body>
</html>
