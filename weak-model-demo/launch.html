<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>launch · 科技发布（弱模型成片）</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  #wrap{display:flex;align-items:center;justify-content:center;height:100%}
  canvas{display:block;height:100%}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="1080" height="1920"></canvas></div>
<script>
const W=1080,H=1920,DUR=15;
const g=document.getElementById('c').getContext('2d');
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
function spring(t,k=170,d=26){
  if(t<=0)return 0;
  const w0=Math.sqrt(k),z=d/(2*w0);
  if(z<1){const wd=w0*Math.sqrt(1-z*z);
    return 1-Math.exp(-z*w0*t)*(Math.cos(wd*t)+(z*w0/wd)*Math.sin(wd*t));}
  return 1-Math.exp(-w0*t)*(1+w0*t);
}
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;
  let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;
  return((t^t>>>14)>>>0)/4294967296;};}
function rrPath(g,x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  g.beginPath();
  g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();
}

const INK='#0a0c10', PANEL='#12151c', LINE='rgba(255,255,255,0.08)';
const LIME='#8ACD00', BLUE='#5b9dff', TXT='#eef1f6', MUT='#8a909c';
const PAIN='#e0644c';

/* ---------- 背景：连续世界（暗场 + 网格 + 呼吸光斑） ---------- */
function bg(T){
  g.fillStyle=INK;g.fillRect(0,0,W,H);
  // 网格（不静止：随相机轻微漂移）
  g.strokeStyle='rgba(255,255,255,0.035)';g.lineWidth=1;
  const gap=72, ox=(T*14)%gap, oy=(T*9)%gap;
  g.beginPath();
  for(let x=-gap+ox;x<W+gap;x+=gap){g.moveTo(x,0);g.lineTo(x,H);}
  for(let y=-gap+oy;y<H+gap;y+=gap){g.moveTo(0,y);g.lineTo(W,y);}
  g.stroke();
  // 顶部冷暖光斑（缓慢呼吸）
  const br=0.5+0.5*Math.sin(T*0.7);
  const grd=g.createRadialGradient(W*0.3,H*0.2,50,W*0.3,H*0.2,700);
  grd.addColorStop(0,`rgba(${91},${157},${255},${0.10+br*0.05})`);
  grd.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=grd;g.fillRect(0,0,W,H);
  const grd2=g.createRadialGradient(W*0.75,H*0.75,50,W*0.75,H*0.75,750);
  grd2.addColorStop(0,`rgba(${138},${205},${0},${0.08+br*0.04})`);
  grd2.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=grd2;g.fillRect(0,0,W,H);
}

/* ---------- Scene 1 · 钩子痛点（逐字弹簧） ---------- */
function s1(t){
  g.textAlign='center';g.textBaseline='middle';
  const lines=[['还','在','手','动'],['对','齐','？']];
  let base=0;
  lines.forEach((line,li)=>{
    const yy=H*0.4+li*190;
    line.forEach((w,wi)=>{
      const idx=base+wi;
      const s=spring(t-0.15-idx*0.1,150,20);
      const xx=W*0.5-(line.length-1)*90+wi*180;
      g.save();g.translate(xx,yy);g.scale(0.4+0.6*s,0.4+0.6*s);
      g.globalAlpha=clamp(s*1.4);
      g.fillStyle=w==='？'?PAIN:TXT;
      g.font='900 140px "PingFang SC","Microsoft YaHei",sans-serif';
      g.fillText(w,0,0);
      g.restore();
    });
    base+=line.length;
  });
  const sub=spring(t-0.9,120,18);
  g.globalAlpha=clamp(sub);g.fillStyle=MUT;
  g.font='500 42px Inter,sans-serif';g.textAlign='center';
  g.fillText('一遍遍拖拽、调整、返工…',W*0.5,H*0.4+420);
  g.globalAlpha=1;
}

/* ---------- 产品 UI 卡片（被多个场景复用） ---------- */
const CARD = { w:820, h:1180 };
function cardTransform(t, appear){
  const cw=CARD.w, ch=CARD.h, cx=W/2, cy=H*0.52;
  const a=spring(appear,140,18);
  const lift=(1-a)*120;
  g.save();
  g.translate(cx,cy+lift);
  g.scale(0.8+0.2*a,0.8+0.2*a);
  g.globalAlpha=clamp(a*1.3);
  return {cw,ch,a};
}
function drawCardShell(cw,ch){
  rrPath(g,-cw/2,-ch/2,cw,ch,36);
  g.fillStyle=PANEL;g.fill();
  g.strokeStyle=LINE;g.lineWidth=2;g.stroke();
  g.fillStyle='rgba(255,255,255,0.06)';
  rrPath(g,-cw/2+24,-ch/2+24,cw-48,90,18);g.fill();
  g.fillStyle=LIME;
  g.beginPath();g.arc(-cw/2+70,-ch/2+69,14,0,7);g.fill();
  g.fillStyle=MUT;g.font='600 30px Inter';g.textAlign='left';g.textBaseline='middle';
  g.fillText('Doubao 协作',-cw/2+100,-ch/2+69);
}

/* ---------- Scene 2 · 产品出现 + 痛点擦除 ---------- */
function s2(t){
  const wipe=spring(t-0.3,120,16);
  if(wipe<1){
    g.save();
    g.textAlign='center';g.textBaseline='middle';
    g.font='900 130px "PingFang SC",sans-serif';
    g.globalAlpha=(1-wipe)*0.5;g.fillStyle=PAIN;
    g.fillText('手动对齐？',W*0.5,H*0.4);
    g.restore();
  }
  const {cw,ch}=cardTransform(t,t-0.1);
  drawCardShell(cw,ch);
  const bw=cw-80;
  [0,1,2,3].forEach((b,i)=>{
    const s=spring(t-0.45-i*0.13,160,20);
    const by=-ch/2+180+b*210;
    g.save();
    g.globalAlpha=clamp(s*1.4);
    g.translate(-cw/2+40+(1-s)*-40,by);
    g.fillStyle=i===3?'rgba(138,205,0,0.16)':'rgba(255,255,255,0.05)';
    rrPath(g,0,0,bw,160,16);g.fill();
    if(i===3){
      g.fillStyle=LIME;g.font='700 34px Inter';g.textAlign='center';g.textBaseline='middle';
      g.fillText('已自动对齐',bw/2,80);
    } else {
      g.fillStyle='rgba(255,255,255,0.14)';
      rrPath(g,28,34,200,30,8);g.fill();
      g.fillStyle='rgba(255,255,255,0.07)';
      rrPath(g,28,90,bw-80,40,8);g.fill();
    }
    g.restore();
  });
  g.restore();
}

/* ---------- Scene 3 · 光标点击 + 自动吸附 ---------- */
function cursorAt(x,y,press){
  g.save();g.translate(x,y);
  g.fillStyle='#fff';g.strokeStyle='rgba(0,0,0,0.5)';g.lineWidth=2;
  g.beginPath();
  g.moveTo(0,0);g.lineTo(0,26);g.lineTo(7,20);g.lineTo(11,31);g.lineTo(15,29);
  g.lineTo(11,18);g.lineTo(18,18);g.closePath();
  g.stroke();g.fill();
  g.restore();
}
function s3(t){
  const {cw,ch}=cardTransform(t,1);
  drawCardShell(cw,ch);
  // 散乱方块 → 弹簧吸附到一排（微过冲）
  const targetY=-200;
  for(let i=0;i<4;i++){
    const s=spring(t-0.2-i*0.1,180,16);
    const sx=-cw/2+140+(i%2?240:-160);
    const sy=targetY+(i-1.5)*220;
    const tx=-cw/2+150+i*180;
    const x=lerp(sx,tx,s), y=lerp(sy,targetY,s);
    g.fillStyle=i===3?LIME:BLUE;
    rrPath(g,x-48,y-48,96,96,18);g.fill();
  }
  // 光标两段移动（track 思路）
  const m1=spring(t-0.1,90,16), m2=spring(t-1.0,90,16);
  let x=lerp(260,-200,m1), y=lerp(380,targetY,m1);
  x=lerp(x,200,m2); y=lerp(y,targetY,m2);
  cursorAt(x,y);
  // 提示（卡片局部坐标，原点在卡片中心）
  g.fillStyle=MUT;g.font='500 30px Inter';g.textAlign='center';g.textBaseline='middle';
  g.fillText('一键对齐，元素自动吸附',0,ch/2+90);
  g.restore();
}

/* ---------- Scene 4 · 活数字证据 ---------- */
function s4(t){
  const {cw,ch}=cardTransform(t,1);
  drawCardShell(cw,ch);
  g.save();
  const ring=spring(t-0.2,120,16);
  const cx=0,cy=-120,R=240;
  g.strokeStyle='rgba(255,255,255,0.08)';g.lineWidth=24;
  g.beginPath();g.arc(cx,cy,R,0,7);g.stroke();
  g.strokeStyle=LIME;g.lineCap='round';
  g.beginPath();g.arc(cx,cy,R,-Math.PI/2,-Math.PI/2+Math.PI*2*ring);g.stroke();
  const val=3.2*spring(t-0.3,110,16);
  g.fillStyle=TXT;g.font='900 110px Inter';g.textAlign='center';g.textBaseline='middle';
  g.fillText(val.toFixed(1)+'x',cx,cy);
  g.fillStyle=MUT;g.font='600 32px Inter';
  g.fillText('协作效率提升',cx,cy+180);
  g.restore();
  g.restore();
}

/* ---------- Scene 5 · Logo 舞台 + CTA ---------- */
function s5(t){
  const cx=W*0.5,cy=H*0.4;
  // logo 由两笔几何组装
  const a=spring(t-0.15,150,18);
  g.save();g.translate(cx,cy);
  // 圆角方块
  const s=0.6+0.4*a;
  g.scale(s,s);
  g.fillStyle=LIME;
  rrPath(g,-90,-90,180,180,44);g.fill();
  // 内部两个点
  g.fillStyle='#0c0f02';
  g.beginPath();g.arc(-32,0,18,0,7);g.fill();
  g.beginPath();g.arc(32,0,18,0,7);g.fill();
  g.restore();
  g.fillStyle=TXT;g.font='800 64px Inter';g.textAlign='center';g.textBaseline='middle';
  g.globalAlpha=clamp(a*1.3);
  g.fillText('Doubao',cx,cy+200);
  g.fillStyle=MUT;g.font='500 36px Inter';
  g.fillText('让协作，即刻发生',cx,cy+270);
  // CTA 按钮
  const b=spring(t-0.6,140,18);
  g.globalAlpha=clamp(b*1.3);
  g.save();g.translate(cx,cy+420);g.scale(0.9+0.1*b,0.9+0.1*b);
  g.fillStyle=LIME;rrPath(g,-200,-48,400,96,48);g.fill();
  g.fillStyle='#0c0f02';g.font='800 40px Inter';g.textAlign='center';g.textBaseline='middle';
  g.fillText('立即体验',0,0);
  g.restore();
  g.globalAlpha=1;
}

/* ---------- 场景时间轴（首尾同帧循环） ---------- */
const SCENES=[
  {from:0,to:2.8,draw:s1},
  {from:2.8,to:5.5,draw:s2},
  {from:5.5,to:8.3,draw:s3},
  {from:8.3,to:10.8,draw:s4},
  {from:10.8,to:14,draw:s5},
  // 收尾：淡出回到暗场，与第一帧对齐
];

/* 全局相机：呼吸 + 第4段推进 */
function camera(T){
  const breathe=Math.sin(T*0.8)*0.006;
  let push=spring(T-8.3,90,14)*0.07 - spring(T-10.8,90,14)*0.07;
  // 收尾回 1
  push-=spring(T-14,100,16)*0.0;
  return {zoom:1+push+breathe, x:Math.cos(T*0.7)*0.004, y:0};
}

function draw(T){
  bg(T);
  // 收尾淡出（14-15），让最后回到暗场
  const endOut=spring(T-14.2,100,16);
  const cam=camera(T);
  g.save();
  g.translate(W/2,H/2);
  g.scale(cam.zoom,cam.zoom);
  g.translate(-W/2+cam.x*W,-H/2+cam.y*H);
  g.save();
  g.globalAlpha=1-endOut;
  for(const s of SCENES){
    if(T>=s.from && T<s.to) s.draw(T-s.from);
  }
  g.restore();
  g.restore();
}

window.seek=(t)=>{draw(clamp(t,0,DUR));return true;};
if(!navigator.webdriver){
  const t0=performance.now();
  (function loop(){
    if(window.__stop) return;
    draw(((performance.now()-t0)/1000)%DUR);
    requestAnimationFrame(loop);
  })();
}
</script>
</body>
</html>
