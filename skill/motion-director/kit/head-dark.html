  html,body{margin:0;background:#060606}
  canvas{display:block;width:100%;height:100%;object-fit:contain}

<body>
<canvas id="c"></canvas>
<script>
/* ===== STUDIO KIT (dark) — same primitives + 3D sphere ===== */
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a));return t*t*(3-2*t);};
const easeOutCubic=x=>1-Math.pow(1-x,3);
const easeInOutCubic=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const easeOutExpo=x=>x>=1?1:1-Math.pow(2,-10*x);
function spring(t,k=170,d=26){
  if(t<=0)return 0;
  if(t>3)return 1;
  const w0=Math.sqrt(k),z=d/(2*w0);
  if(z<1){const wd=w0*Math.sqrt(1-z*z);
    return 1-Math.exp(-z*w0*t)*(Math.cos(wd*t)+(z*w0/wd)*Math.sin(wd*t));}
  return 1-Math.exp(-w0*t)*(1+w0*t);
}
function rng(seed){return ()=>{seed|=0;seed=seed+0x6D2B79F5|0;
  let t=Math.imul(seed^seed>>>15,1|seed);
  t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;};}
function hex2rgb(h){h=h.replace('#','');
  if(h.length===3)h=h.split('').map(c=>c+c).join('');
  const n=parseInt(h,16);return[(n>>16)&255,(n>>8)&255,n&255];}
function mixHex(a,b,t){const A=hex2rgb(a),B=hex2rgb(b);
  return `rgb(${Math.round(lerp(A[0],B[0],t))},${Math.round(lerp(A[1],B[1],t))},${Math.round(lerp(A[2],B[2],t))})`;}
function rgba(hex,a){const c=hex2rgb(hex);return `rgba(${c[0]},${c[1]},${c[2]},${a})`;}
function rr(g,x,y,w,h,r){r=Math.min(r,Math.abs(w)/2,Math.abs(h)/2);
  g.beginPath();g.moveTo(x+r,y);
  g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}

/* ===== 3D points on a sphere (fibonacci) ===== */
function spherePoints(N){
  const pts=[];
  const phi=Math.PI*(3-Math.sqrt(5));
  for(let i=0;i<N;i++){
    const y=1-(i/(N-1))*2;
    const rad=Math.sqrt(1-y*y);
    const th=phi*i;
    pts.push({x:Math.cos(th)*rad,y,z:Math.sin(th)*rad});
  }
  return pts;
}
function rotY(p,a){const c=Math.cos(a),s=Math.sin(a);
  return {x:p.x*c-p.z*s,y:p.y,z:p.x*s+p.z*c};}
function rotX(p,a){const c=Math.cos(a),s=Math.sin(a);
  return {x:p.x,y:p.y*c-p.z*s,z:p.y*s+p.z*c};}
