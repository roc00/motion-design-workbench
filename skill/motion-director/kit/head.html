<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>STUDIO_MORPH</title>
<style>
  html,body{margin:0;background:#ECEAE4}
  canvas{display:block;width:100%;height:100%;object-fit:contain}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* ============================================================
   STUDIO KIT — high-craft Canvas 2D
   soft shadows · gradients · color mixing · blur · morph engine ·
   cursor choreography · grain · vignette
   ============================================================ */
const clamp = (x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp = (a,b,t)=>a+(b-a)*t;
const smooth = (a,b,x)=>{const t=clamp((x-a)/(b-a));return t*t*(3-2*t);};
const easeOutCubic=x=>1-Math.pow(1-x,3);
const easeInOutCubic=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const easeOutExpo=x=>x>=1?1:1-Math.pow(2,-10*x);

/* closed-form damped spring 0→1, pure function of time */
function spring(t,k=170,d=26){
  if(t<=0)return 0;
  if(t>3)return 1;
  const w0=Math.sqrt(k), z=d/(2*w0);
  if(z<1){
    const wd=w0*Math.sqrt(1-z*z);
    return 1-Math.exp(-z*w0*t)*(Math.cos(wd*t)+(z*w0/wd)*Math.sin(wd*t));
  }
  return 1-Math.exp(-w0*t)*(1+w0*t);
}
/* multi-target spring track: keys [[t,val],...] */
function track(t,keys,k=170,d=26){
  let v=keys[0][1];
  for(let i=1;i<keys.length;i++)
    v+=(keys[i][1]-keys[i-1][1])*spring(t-keys[i][0],k,d);
  return v;
}

/* seeded random (never Math.random) */
function rng(seed){return ()=>{seed|=0;seed=seed+0x6D2B79F5|0;
  let t=Math.imul(seed^seed>>>15,1|seed);
  t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;};}

/* ---------------- color ---------------- */
function hex2rgb(h){
  h=h.replace('#','');
  if(h.length===3)h=h.split('').map(c=>c+c).join('');
  const n=parseInt(h,16);
  return [(n>>16)&255,(n>>8)&255,n&255];
}
function mixHex(a,b,t){
  const A=hex2rgb(a),B=hex2rgb(b);
  const r=Math.round(lerp(A[0],B[0],t)),g=Math.round(lerp(A[1],B[1],t)),bl=Math.round(lerp(A[2],B[2],t));
  return `rgb(${r},${g},${bl})`;
}
function rgba(hex,a){
  const c=hex2rgb(hex);return `rgba(${c[0]},${c[1]},${c[2]},${a})`;
}

/* ---------------- rounded rect ---------------- */
function rr(g,x,y,w,h,r){
  r=Math.min(r,Math.abs(w)/2,Math.abs(h)/2);
  g.beginPath();
  g.moveTo(x+r,y);
  g.arcTo(x+w,y,x+w,y+h,r);
  g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r);
  g.arcTo(x,y,x+w,y,r);
  g.closePath();
}

/* ---------------- morph engine ----------------
   STATES: {t, cx, cy, w, h, r, fill}
   returns geometry at time t */
function morphGeo(t,states){
  if(t<=states[0].t)return states[0];
  let i=0;
  for(let k=1;k<states.length;k++){if(t>=states[k].t)i=k;}
  if(i>=states.length-1){
    // past last: loop toward first
    const from=states[states.length-1],to=states[0];
    const p=spring(t-from.t,160,24);
    return interpGeo(from,to,p);
  }
  const from=states[i],to=states[i+1];
  const p=spring(t-to.t,160,24);
  return interpGeo(from,to,p);
}
function interpGeo(a,b,p){
  return {
    cx:lerp(a.cx,b.cx,p), cy:lerp(a.cy,b.cy,p),
    w:lerp(a.w,b.w,p), h:lerp(a.h,b.h,p),
    r:lerp(a.r,b.r,p),
    fill:mixHex(a.fill,b.fill,p)
  };
}
/* how settled is the current state (for content alpha) */
function morphSettle(t,states){
  if(t<=states[0].t)return 1;
  let i=0;
  for(let k=1;k<states.length;k++){if(t>=states[k].t)i=k;}
  if(i>=states.length-1)return 1; // loop closure: last state holds its content
  const to=states[i+1];
  // content of the state we are morphing FROM fades out; new content fades in
  return clamp(1-spring(t-to.t,180,22)*1.3);
}
function morphNewAlpha(t,states){
  let i=0;
  for(let k=1;k<states.length;k++){if(t>=states[k].t)i=k;}
  if(i>=states.length-1)return 0;
  const to=states[i+1];
  return clamp(spring(t-to.t,200,20)*1.3);
}

/* ---------------- cursor ---------------- */
function cursorPos(t,waypoints){
  // waypoints [{t,x,y}]
  let i=0;
  for(let k=1;k<waypoints.length;k++){if(t>=waypoints[k].t)i=k;}
  const a=waypoints[i],b=waypoints[Math.min(i+1,waypoints.length-1)];
  const p=easeInOutCubic(clamp((t-a.t)/(b.t-a.t)));
  return {x:lerp(a.x,b.x,p),y:lerp(a.y,b.y,p)};
}
function drawCursor(g,x,y,click=0){
  g.save();
  const s=1+click*0.45;
  g.translate(x,y);g.scale(s,s);
  // click ripple
  if(click>0.05){
    g.globalAlpha=click*0.5;
    g.strokeStyle='#000';g.lineWidth=2;
    g.beginPath();g.arc(0,0,8+(1-click)*26,0,7);g.stroke();
  }
  g.globalAlpha=1;
  g.fillStyle='#0A0A0A';
  g.beginPath();
  g.moveTo(0,0);g.lineTo(0,22);g.lineTo(6,17);g.lineTo(10,26);g.lineTo(14,24);g.lineTo(9,15);g.lineTo(16,15);
  g.closePath();g.fill();
  g.restore();
}
