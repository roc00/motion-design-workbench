<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>颗粒渐变 · Grainy gradient</title>
<style>
  html,body{margin:0;height:100%;background:#0a0a0a;overflow:hidden}
  #wrap{display:flex;align-items:center;justify-content:center;height:100%}
  canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="1280" height="720"></canvas></div>
<script>
const W=1280,H=720,DUR=12;
const g=document.getElementById('c').getContext('2d');

const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
function spring(t,k=170,d=26){
  if(t<=0)return 0;
  const w0=Math.sqrt(k),z=d/(2*w0);
  if(z<1){const wd=w0*Math.sqrt(1-z*z);
    return 1-Math.exp(-z*w0*t)*(Math.cos(wd*t)+(z*w0/wd)*Math.sin(wd*t));}
  return 1-Math.exp(-w0*t)*(1+w0*t);
}
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;
  let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;
  return((t^t>>>14)>>>0)/4294967296;};}


function grain(seed,a){
  const rr=rng(seed);
  for(let i=0;i<900;i++){g.fillStyle='rgba(255,255,255,'+(a*rr())+')';
    g.fillRect(rr()*W,rr()*H,2,2);}
}
function grad(t){
  const x=W/2+Math.sin(t*0.6)*120, y=H/2+Math.cos(t*0.5)*80;
  const grd=g.createRadialGradient(x,y,40,W/2,H/2,760);
  grd.addColorStop(0,'#7c3aed');grd.addColorStop(0.5,'#db2777');grd.addColorStop(1,'#0b1020');
  g.fillStyle=grd;g.fillRect(0,0,W,H);
}


const SCENES=[
{from:0,to:4,draw(t){
  grad(t);grain(9,0.06);
  const r=spring(t-0.2,90,18);
  g.fillStyle='#fff';g.font='900 84px Arial';g.textAlign='center';g.textBaseline='middle';
  g.globalAlpha=r;g.fillText('FLUID',W/2,H/2);g.globalAlpha=1;
}},
{from:4,to:8,draw(t){
  grad(t+2);grain(13,0.08);
  // 光晕
  const r=spring(t-0.2,90,18);
  const grd=g.createRadialGradient(W/2,H/2,20,W/2,H/2,300);
  grd.addColorStop(0,'rgba(255,255,255,'+(0.2*r)+')');grd.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=grd;g.fillRect(0,0,W,H);
  g.fillStyle='#fff';g.font='900 64px Arial';g.textAlign='center';g.textBaseline='middle';
  g.fillText('GRADIENT GLOW',W/2,H/2);
}},
{from:8,to:12,draw(t){
  grad(t+4);grain(17,0.07);
  const r=spring(t-0.2,90,18);
  g.fillStyle='#fff';g.font='900 70px Arial';g.textAlign='center';g.textBaseline='middle';
  g.globalAlpha=r;g.fillText('Dreamy',W/2,H/2);g.globalAlpha=1;
}}
];

function draw(t){
  g.setTransform(1,0,0,1,0,0);
  g.clearRect(0,0,W,H);
  for(const s of SCENES){ if(t>=s.from&&t<s.to) s.draw(t-s.from); }
}
window.seek=(t)=>{draw(clamp(t,0,DUR));return true;};
if(!navigator.webdriver){
  const t0=performance.now();
  (function loop(){draw(((performance.now()-t0)/1000)%DUR);requestAnimationFrame(loop);})();
}
</script>
</body>
</html>
