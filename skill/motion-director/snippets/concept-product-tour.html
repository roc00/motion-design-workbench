<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>产品巡览+主张 · Product tour</title>
<style>
  html,body{margin:0;height:100%;background:#0a0a0a;overflow:hidden}
  #wrap{display:flex;align-items:center;justify-content:center;height:100%}
  canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="1280" height="720"></canvas></div>
<script>
const W=1280,H=720,DUR=15;
const g=document.getElementById('c').getContext('2d');

const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
function spring(t,k=170,d=26){
  if(t<=0)return 0;
  const w0=Math.sqrt(k),z=d/(2*w0);
  if(z<1){const wd=w0*Math.sqrt(1-z*z);
    return 1-Math.exp(-z*w0*t)*(Math.cos(wd*t)+(z*w0/wd)*Math.sin(wd*t));}
  return 1-Math.exp(-w0*t)*(1+w0*t);
}
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;
  let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;
  return((t^t>>>14)>>>0)/4294967296;};}

const BG='#f4f6f9', FG='#1f2937', ACC='#3b82f6';


function world(T){
  g.fillStyle=BG;g.fillRect(0,0,W,H);
  // 横向巡览
  const stations=4;
  const idx=Math.min(stations-1,Math.floor(T/3));
  const lt=(T%3)/3;
  const x=W/2-idx*300+ (1-spring(lt,120,16))*-300;
  g.fillStyle='#fff';g.beginPath();g.roundRect(x-150,H/2-110,300,220,14);g.fill();
  g.fillStyle=ACC;g.textAlign='center';g.font='900 46px Arial';
  g.fillText('模块 '+(idx+1),x,H/2);
  g.fillStyle=FG;g.font='400 30px Arial';
  g.fillText('每站一句主张',x,H/2+70);
}
const SCENES=[
  {from:0,to:8,draw(t){world(t);}},
  {from:8,to:15,draw(t){world(t+8);}}
];

function draw(t){
  g.setTransform(1,0,0,1,0,0);
  g.clearRect(0,0,W,H);
  for(const s of SCENES){ if(t>=s.from&&t<s.to) s.draw(t-s.from); }
}
window.seek=(t)=>{draw(clamp(t,0,DUR));return true;};
if(!navigator.webdriver){
  const t0=performance.now();
  (function loop(){draw(((performance.now()-t0)/1000)%DUR);requestAnimationFrame(loop);})();
}
</script>
</body>
</html>
