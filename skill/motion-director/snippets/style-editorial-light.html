<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>编辑亮色 · Editorial light</title>
<style>
  html,body{margin:0;height:100%;background:#0a0a0a;overflow:hidden}
  #wrap{display:flex;align-items:center;justify-content:center;height:100%}
  canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="1280" height="720"></canvas></div>
<script>
const W=1280,H=720,DUR=12;
const g=document.getElementById('c').getContext('2d');

const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
function spring(t,k=170,d=26){
  if(t<=0)return 0;
  const w0=Math.sqrt(k),z=d/(2*w0);
  if(z<1){const wd=w0*Math.sqrt(1-z*z);
    return 1-Math.exp(-z*w0*t)*(Math.cos(wd*t)+(z*w0/wd)*Math.sin(wd*t));}
  return 1-Math.exp(-w0*t)*(1+w0*t);
}
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;
  let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;
  return((t^t>>>14)>>>0)/4294967296;};}


const PAPER='#f7f5f0', INK='#1a1a1a', MUT='#8a857c';
function hairline(y,a){g.strokeStyle='rgba(26,26,26,'+a+')';g.lineWidth=1;g.beginPath();g.moveTo(140,y);g.lineTo(W-140,y);g.stroke();}


const SCENES=[
{from:0,to:4,draw(t){
  g.fillStyle=PAPER;g.fillRect(0,0,W,H);
  const r=spring(t-0.2,90,20);
  g.fillStyle=INK;g.font='700 84px Georgia';g.textAlign='left';g.textBaseline='middle';
  g.save();g.beginPath();g.rect(140,H/2-140,1000*r,120);g.clip();
  g.fillText('Editorial Light',140,H/2-80);g.restore();
  hairline(H/2+30,r*0.6);
  g.fillStyle=MUT;g.font='400 34px Georgia';
  g.globalAlpha=spring(t-0.6,90,20);g.fillText('衬线 · 留白 · 细分隔线',140,H/2+100);g.globalAlpha=1;
}},
{from:4,to:8,draw(t){
  g.fillStyle=PAPER;g.fillRect(0,0,W,H);
  const lines=['长文阅读的节奏','行与行之间的呼吸','衬线的稳定感'];
  lines.forEach((l,i)=>{
    const a=spring(t-0.2-i*0.22,90,20);
    g.fillStyle=INK;g.font='400 46px Georgia';g.textAlign='left';
    g.globalAlpha=a;g.fillText(l,140,H/2-80+i*90);g.globalAlpha=1;
    hairline(H/2-40+i*90,a*0.4);
  });
}},
{from:8,to:12,draw(t){
  g.fillStyle=PAPER;g.fillRect(0,0,W,H);
  const r=spring(t-0.2,90,20);
  g.fillStyle=INK;g.font='700 70px Georgia';g.textAlign='center';g.textBaseline='middle';
  g.globalAlpha=r;g.fillText('“留白即设计”',W/2,H/2);g.globalAlpha=1;
  hairline(H/2+80,r*0.6);
}}
];

function draw(t){
  g.setTransform(1,0,0,1,0,0);
  g.clearRect(0,0,W,H);
  for(const s of SCENES){ if(t>=s.from&&t<s.to) s.draw(t-s.from); }
}
window.seek=(t)=>{draw(clamp(t,0,DUR));return true;};
if(!navigator.webdriver){
  const t0=performance.now();
  (function loop(){draw(((performance.now()-t0)/1000)%DUR);requestAnimationFrame(loop);})();
}
</script>
</body>
</html>
