<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>海报色块 · Poster color-block</title>
<style>
  html,body{margin:0;height:100%;background:#0a0a0a;overflow:hidden}
  #wrap{display:flex;align-items:center;justify-content:center;height:100%}
  canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="1280" height="720"></canvas></div>
<script>
const W=1280,H=720,DUR=12;
const g=document.getElementById('c').getContext('2d');

const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
function spring(t,k=170,d=26){
  if(t<=0)return 0;
  const w0=Math.sqrt(k),z=d/(2*w0);
  if(z<1){const wd=w0*Math.sqrt(1-z*z);
    return 1-Math.exp(-z*w0*t)*(Math.cos(wd*t)+(z*w0/wd)*Math.sin(wd*t));}
  return 1-Math.exp(-w0*t)*(1+w0*t);
}
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;
  let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;
  return((t^t>>>14)>>>0)/4294967296;};}


const RED='#e63946', NAVY='#1d3557', CREAM='#f1faee', GOLD='#ffd166', GREEN='#06d6a0';


const SCENES=[
{from:0,to:4,draw(t){
  g.fillStyle=CREAM;g.fillRect(0,0,W,H);
  // 几何色块从不同方向滑入
  const a=spring(t-0.1,130,18), b=spring(t-0.25,130,18), c=spring(t-0.4,130,18);
  g.fillStyle=RED;  g.fillRect(0,0, W, 180*a);
  g.fillStyle=NAVY; g.fillRect(W-260*b,0,260*b,H);
  g.fillStyle=GOLD; g.fillRect(0,H-150*c,420*c,150);
  g.fillStyle=GREEN;g.fillRect(120,240,120*c,120*c);
  g.fillStyle=NAVY;g.font='900 96px Arial';g.textAlign='center';g.textBaseline='middle';
  g.globalAlpha=a;g.fillText('POSTER',W/2-120,H/2);g.globalAlpha=1;
}},
{from:4,to:8,draw(t){
  // 硬切到色块底 + 粗体
  g.fillStyle=NAVY;g.fillRect(0,0,W,H);
  const r=spring(t-0.1,200,16);
  g.fillStyle=GOLD;g.font='900 130px Arial';g.textAlign='center';g.textBaseline='middle';
  g.globalAlpha=r;g.fillText('COLOR BLOCK',W/2,H/2);g.globalAlpha=1;
  g.fillStyle=RED;g.fillRect(W/2-200,H/2+100,400*r,10);
}},
{from:8,to:12,draw(t){
  g.fillStyle=CREAM;g.fillRect(0,0,W,H);
  // 几何 wipe 收束
  const w=spring(t-0.1,120,16);
  g.fillStyle=RED;g.fillRect(0,0,W*w,H);
  g.fillStyle=NAVY;g.font='900 90px Arial';g.textAlign='center';g.textBaseline='middle';
  g.save();g.beginPath();g.rect(0,0,W*w,H);g.clip();
  g.fillStyle=CREAM;g.fillText('HARD CUT',W/2,H/2);g.restore();
}}
];

function draw(t){
  g.setTransform(1,0,0,1,0,0);
  g.clearRect(0,0,W,H);
  for(const s of SCENES){ if(t>=s.from&&t<s.to) s.draw(t-s.from); }
}
window.seek=(t)=>{draw(clamp(t,0,DUR));return true;};
if(!navigator.webdriver){
  const t0=performance.now();
  (function loop(){draw(((performance.now()-t0)/1000)%DUR);requestAnimationFrame(loop);})();
}
</script>
</body>
</html>
