<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>舞台即 Logo · Logo as stage</title>
<style>
  html,body{margin:0;height:100%;background:#0a0a0a;overflow:hidden}
  #wrap{display:flex;align-items:center;justify-content:center;height:100%}
  canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="1280" height="720"></canvas></div>
<script>
const W=1280,H=720,DUR=12;
const g=document.getElementById('c').getContext('2d');

const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
function spring(t,k=170,d=26){
  if(t<=0)return 0;
  const w0=Math.sqrt(k),z=d/(2*w0);
  if(z<1){const wd=w0*Math.sqrt(1-z*z);
    return 1-Math.exp(-z*w0*t)*(Math.cos(wd*t)+(z*w0/wd)*Math.sin(wd*t));}
  return 1-Math.exp(-w0*t)*(1+w0*t);
}
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;
  let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;
  return((t^t>>>14)>>>0)/4294967296;};}

const BG='#101218', FG='#e8ecf3', ACC='#d97757';


function world(T){
  g.fillStyle=BG;g.fillRect(0,0,W,H);
  // logo 展开为舞台
  const open=spring(T-0.2,90,18);
  const r=40+open*200;
  g.strokeStyle=ACC;g.lineWidth=4;
  g.beginPath();g.roundRect(W/2-r,H/2-r*0.7,r*2,r*1.4,20);g.stroke();
  g.fillStyle=FG;g.textAlign='center';g.textBaseline='middle';g.font='900 60px Arial';
  g.globalAlpha=open;g.fillText('STAGE',W/2,H/2);g.globalAlpha=1;
}
const SCENES=[
  {from:0,to:6,draw(t){world(t);}},
  {from:6,to:12,draw(t){
    // 回到 logo
    const back=spring(t-1,90,18);
    const r=240-back*200;
    g.fillStyle=BG;g.fillRect(0,0,W,H);
    g.strokeStyle=ACC;g.lineWidth=4;
    g.beginPath();g.roundRect(W/2-r,H/2-r*0.7,r*2,r*1.4,20);g.stroke();
    g.fillStyle=FG;g.textAlign='center';g.textBaseline='middle';g.font='900 50px Arial';
    g.fillText('LOGO',W/2,H/2);
  }}
];

function draw(t){
  g.setTransform(1,0,0,1,0,0);
  g.clearRect(0,0,W,H);
  for(const s of SCENES){ if(t>=s.from&&t<s.to) s.draw(t-s.from); }
}
window.seek=(t)=>{draw(clamp(t,0,DUR));return true;};
if(!navigator.webdriver){
  const t0=performance.now();
  (function loop(){draw(((performance.now()-t0)/1000)%DUR);requestAnimationFrame(loop);})();
}
</script>
</body>
</html>
