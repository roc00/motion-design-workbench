<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>扁平照片拼贴 · Flat pop with photos</title>
<style>
  html,body{margin:0;height:100%;background:#0a0a0a;overflow:hidden}
  #wrap{display:flex;align-items:center;justify-content:center;height:100%}
  canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="1280" height="720"></canvas></div>
<script>
const W=1280,H=720,DUR=12;
const g=document.getElementById('c').getContext('2d');

const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
function spring(t,k=170,d=26){
  if(t<=0)return 0;
  const w0=Math.sqrt(k),z=d/(2*w0);
  if(z<1){const wd=w0*Math.sqrt(1-z*z);
    return 1-Math.exp(-z*w0*t)*(Math.cos(wd*t)+(z*w0/wd)*Math.sin(wd*t));}
  return 1-Math.exp(-w0*t)*(1+w0*t);
}
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;
  let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;
  return((t^t>>>14)>>>0)/4294967296;};}


const BG='#eef2f7', INK='#1f2733', ACC='#3b82f6';
function photo(x,y,w,h,seed){
  g.fillStyle='#c9d3df';g.fillRect(x,y,w,h);
  // 用色块模拟照片占位（片段离线可用）
  const rr=rng(seed);
  g.fillStyle=ACC;g.globalAlpha=0.25;
  for(let i=0;i<6;i++)g.fillRect(x+rr()*w,y+rr()*h,40,30);
  g.globalAlpha=1;
}


const SCENES=[
{from:0,to:4,draw(t){
  g.fillStyle=BG;g.fillRect(0,0,W,H);
  // 照片 pop
  const r=spring(t-0.2,180,14);
  const s=0.5+0.5*r;
  g.save();g.translate(W/2,H/2);g.scale(s,s);g.translate(-300,-170);
  photo(0,0,600,340,5);
  g.fillStyle=INK;g.fillRect(0,0,600,340);
  g.fillStyle=BG;g.fillRect(0,0,600*r,340);g.restore();
}},
{from:4,to:8,draw(t){
  g.fillStyle=BG;g.fillRect(0,0,W,H);
  const a=spring(t-0.1,140,16),b=spring(t-0.3,140,16);
  g.fillStyle=INK;g.fillRect(160,180,360*a,220);
  g.fillStyle=ACC;g.fillRect(560,260,360*b,220);
  g.fillStyle=BG;g.font='900 50px Arial';g.textAlign='center';
  g.globalAlpha=a;g.fillText('PHOTO + FLAT',340,300);g.globalAlpha=1;
  g.globalAlpha=b;g.fillText('POP',740,380);g.globalAlpha=1;
}},
{from:8,to:12,draw(t){
  g.fillStyle=BG;g.fillRect(0,0,W,H);
  const r=spring(t-0.2,140,16);
  g.fillStyle=INK;g.font='900 74px Arial';g.textAlign='center';g.textBaseline='middle';
  g.globalAlpha=r;g.fillText('图文结合',W/2,H/2);g.globalAlpha=1;
}}
];

function draw(t){
  g.setTransform(1,0,0,1,0,0);
  g.clearRect(0,0,W,H);
  for(const s of SCENES){ if(t>=s.from&&t<s.to) s.draw(t-s.from); }
}
window.seek=(t)=>{draw(clamp(t,0,DUR));return true;};
if(!navigator.webdriver){
  const t0=performance.now();
  (function loop(){draw(((performance.now()-t0)/1000)%DUR);requestAnimationFrame(loop);})();
}
</script>
</body>
</html>
