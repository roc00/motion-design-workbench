<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Margin · 让每一句话都有位置</title>
<style>
  html,body{margin:0;height:100%;background:#070a12;overflow:hidden}
  #wrap{display:flex;align-items:center;justify-content:center;height:100%}
  canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="1080" height="1920"></canvas></div>
<script>
/* ============================ FILM KIT (9:16) ============================ */
const W=1080,H=1920,DUR=15;
const g=document.getElementById('c').getContext('2d');
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(a,b,t)=>{t=clamp(t);t=t*t*(3-2*t);return lerp(a,b,t);};
const easeOutCubic=t=>1-Math.pow(1-t,3);
const easeInOutCubic=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const easeOutBack=t=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);};
function spring(t,k=170,d=26){
  if(t<=0)return 0;
  const w0=Math.sqrt(k),z=d/(2*w0);
  if(z<1){const wd=w0*Math.sqrt(1-z*z);
    return 1-Math.exp(-z*w0*t)*(Math.cos(wd*t)+(z*w0/wd)*Math.sin(wd*t));}
  return 1-Math.exp(-w0*t)*(1+w0*t);
}
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;
  let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;
  return((t^t>>>14)>>>0)/4294967296;};}
function makeNoise(seed){
  const r=rng(seed),G=new Map();
  const at=(ix,iy)=>{const k=ix+','+iy;if(!G.has(k))G.set(k,r()*2-1);return G.get(k);};
  const fade=t=>t*t*(3-2*t);
  return(x,y)=>{
    const x0=Math.floor(x),y0=Math.floor(y),fx=fade(x-x0),fy=fade(y-y0);
    return lerp(lerp(at(x0,y0),at(x0+1,y0),fx),lerp(at(x0,y0+1),at(x0+1,y0+1),fx),fy);
  };
}
const noise=makeNoise(1337);
/* dark palette (signal) */
const C={ink:'#070b14',panel:'#111a2c',fg:'#eef2f7',muted:'#8290a6',cyan:'#45d1e6',warm:'#f0b95c',indigo:'#7c8cff',green:'#5fe0a8'};
/* light palette (paper) */
const P={paper:'#f4efe6',card:'#fbf8f1',ink:'#23262b',soft:'#6b6f78',line:'#e2dacd',accent:'#c9623f',accent2:'#3a6ea5'};
function rr(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();
}
/* ============================ WORLD LAYERS ============================ */
const PR=rng(20240922);
const PARTICLES=[];
for(let i=0;i<180;i++){
  const z=0.25+PR()*0.75;
  PARTICLES.push({x:PR()*W,y:PR()*H,z,sp:0.15+PR()*0.4,ph:PR()*6.28,r:0.5+z*1.7,
    hue:PR()<0.12?'warm':(PR()<0.2?'indigo':'cyan')});
}
function drawParticles(t,camX,camY,alpha=1){
  for(const p of PARTICLES){
    const dx=Math.sin(t*p.sp+p.ph)*15,dy=Math.cos(t*p.sp*0.8+p.ph)*11;
    const x=((p.x+dx-camX*p.z*1.4)%W+W)%W;
    const y=((p.y+dy-camY*p.z*1.4)%H+H)%H;
    const col=p.hue==='warm'?C.warm:p.hue==='indigo'?C.indigo:C.cyan;
    g.globalAlpha=p.z*0.55*alpha;g.fillStyle=col;
    g.beginPath();g.arc(x,y,p.r,0,6.28);g.fill();
  }g.globalAlpha=1;
}
function drawGrid(t,camX,camY,alpha=1){
  const gap=56,size=1.5;
  const ox=(-camX*0.5)%gap,oy=(-camY*0.5)%gap;
  for(let x=ox;x<W;x+=gap)for(let y=oy;y<H;y+=gap){
    const b=0.35+0.3*noise(x*0.02,y*0.02+t*0.05);
    g.globalAlpha=b*alpha*0.5;g.fillStyle='#5b78a8';
    g.fillRect(x-size/2,y-size/2,size,size);
  }g.globalAlpha=1;
}
const GLYPH='01<>[]{};:=.+-*#$abcdef';
function drawChars(t,camX,camY,alpha=1){
  const cell=32,cols=Math.ceil(W/cell)+1,rows=Math.ceil(H/cell)+1;
  g.font='14px ui-monospace,Menlo,monospace';g.textAlign='center';g.textBaseline='middle';
  for(let i=0;i<cols;i++)for(let j=0;j<rows;j++){
    const x=i*cell+((-camX*0.4)%cell),y=j*cell+((-camY*0.4)%cell);
    const n=noise(i*0.35,j*0.35+t*0.12);
    if(n>0.15){
      g.globalAlpha=clamp(n)*0.5*alpha;g.fillStyle='#5fd6e6';
      g.fillText(GLYPH[Math.floor(Math.abs(n*997))%GLYPH.length],x,y);
    }
  }g.globalAlpha=1;
}
function drawGradient(t,camX,camY,alpha=1){
  const blobs=[[0.25,0.28,640,C.cyan,0.12],[0.75,0.62,720,C.indigo,0.12],[0.6,0.82,520,C.warm,0.08]];
  for(const [bx,by,r,col,a] of blobs){
    const x=bx*W+Math.sin(t*0.2+bx)*30-camX*0.3,y=by*H+Math.cos(t*0.16+by)*24-camY*0.3;
    const gr=g.createRadialGradient(x,y,0,x,y,r);
    gr.addColorStop(0,col);gr.addColorStop(1,'rgba(0,0,0,0)');
    g.globalAlpha=a*alpha/0.12;g.fillStyle=gr;g.fillRect(0,0,W,H);
  }g.globalAlpha=1;
}
function drawWorld(kind,t,camX,camY){
  g.fillStyle=C.ink;g.fillRect(0,0,W,H);
  const gr=g.createRadialGradient(W*0.5,H*0.45,120,W*0.5,H*0.5,1200);
  gr.addColorStop(0,'#0e1525');gr.addColorStop(1,'#060912');
  g.fillStyle=gr;g.fillRect(0,0,W,H);
  if(kind==='particle-field')drawParticles(t,camX,camY);
  else if(kind==='grid')drawGrid(t,camX,camY);
  else if(kind==='character-field')drawChars(t,camX,camY);
  else if(kind==='gradient-field')drawGradient(t,camX,camY);
  else drawParticles(t,camX,camY,0.4);
}
function vignette(){
  const gr=g.createRadialGradient(W/2,H/2,420,W/2,H/2,1200);
  gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,.52)');
  g.fillStyle=gr;g.fillRect(0,0,W,H);
}
function grain(t){
  const r=rng(99+Math.floor(t*12));
  g.globalAlpha=0.05;
  for(let i=0;i<90;i++){
    g.fillStyle=r()<0.5?'#fff':'#000';
    g.fillRect(r()*W,r()*H,1.3,1.3);
  }g.globalAlpha=1;
}
function drawCursor(x,y,scale=1){
  g.save();g.translate(x,y);g.scale(scale,scale);
  g.beginPath();g.moveTo(0,0);g.lineTo(0,22);g.lineTo(6,16);g.lineTo(9,26);g.lineTo(13,25);g.lineTo(10,15);g.lineTo(17,15);
  g.closePath();g.fillStyle='#fff';g.fill();g.lineWidth=1;g.strokeStyle='#000';g.stroke();
  g.restore();
}

/* ===================== FILM 2 · MARGIN (light, writing / notes) ===================== */

function paperBg(t,camX=0,camY=0){
  g.fillStyle=P.paper;g.fillRect(0,0,W,H);
  /* soft warm light */
  const gr=g.createRadialGradient(W*0.5,H*0.4,120,W*0.5,H*0.5,1200);
  gr.addColorStop(0,'rgba(255,253,247,.9)');gr.addColorStop(1,'rgba(228,220,205,.6)');
  g.fillStyle=gr;g.fillRect(0,0,W,H);
  /* faint ruled lines */
  const gap=92;
  const oy=(-camY*0.3)%gap;
  g.strokeStyle='rgba(150,140,118,.16)';g.lineWidth=1.5;
  for(let y=oy;y<H;y+=gap){g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke();}
  /* left margin line */
  g.strokeStyle='rgba(201,98,63,.3)';g.lineWidth=2;
  g.beginPath();g.moveTo(150-camX*0.3,0);g.lineTo(150-camX*0.3,H);g.stroke();
}

/* scene 1: hook — big word WRITE, paper, complete at t=0 */
function m1Hook(t){
  const camX=Math.sin(t*0.3)*10,camY=Math.cos(t*0.25)*8;
  paperBg(t,camX,camY);
  const z=1+clamp(t/2.5)*0.08;
  g.save();
  const bx=W*0.52,by=H*0.46;
  g.translate(bx,by);g.scale(z,z);g.translate(-bx,-by);
  /* word complete at first frame */
  g.font='800 176px Georgia,"Times New Roman",serif';g.textAlign='center';g.textBaseline='middle';
  g.fillStyle=P.ink;
  g.fillText('WRITE',bx,by);
  /* accent stroke through */
  const ul=spring(t-0.1,120,18);
  g.strokeStyle=P.accent;g.lineWidth=8;g.lineCap='round';
  g.beginPath();g.moveTo(bx-280,by+118);g.lineTo(bx-280+560*ul,by+118);g.stroke();
  const k=spring(t-0.5,100,15);
  g.fillStyle=P.soft;g.font='600 38px Inter';g.globalAlpha=k;
  g.fillText('把想法，放到它该在的位置',bx,by+205);
  g.globalAlpha=1;
  g.restore();
}

/* scene 2: macro typing — cursor types text on a paper card */
function m2Type(t){
  const camX=Math.sin(t*0.3)*9,camY=Math.cos(t*0.2)*7;
  paperBg(t,camX,camY);
  const z=1+clamp(t/3)*0.05;
  g.save();
  const bx=W*0.5,by=H*0.44;
  g.translate(bx,by);g.scale(z,z);g.translate(-bx,-by);
  const x=110,y=520,pw=860,ph=780;
  const r=spring(t-0.1,120,18);
  g.globalAlpha=r;
  g.fillStyle=P.card;g.shadowColor='rgba(90,80,60,.22)';g.shadowBlur=34;g.shadowOffsetY=14;
  rr(x,y,pw,ph,20);g.fill();
  g.shadowBlur=0;g.shadowOffsetY=0;g.shadowColor='transparent';
  g.strokeStyle=P.line;g.lineWidth=1.5;rr(x,y,pw,ph,20);g.stroke();
  g.globalAlpha=1;
  /* typed text */
  const TEXT='今天要写的，是关于节奏。';
  const n=clamp(Math.floor(t*5.2),0,TEXT.length);
  g.fillStyle=P.ink;g.font='700 44px Georgia,serif';g.textAlign='left';g.textBaseline='middle';
  /* wrap into 2 lines */
  const l1=TEXT.slice(0,Math.min(n,9));
  const l2=TEXT.slice(9,Math.max(9,n));
  g.fillText(l1,x+48,y+110);
  if(n>9)g.fillText(l2,x+48,y+190);
  /* caret */
  const tw=g.measureText(n>9?l2:l1).width;
  const caretX=x+48+(n>9?tw:0),caretY=y+(n>9?190:110);
  const blink=Math.floor(t*2)%2;
  g.globalAlpha=blink?1:0.2;g.fillStyle=P.accent;
  g.fillRect(caretX+2,caretY-26,3,52);
  g.globalAlpha=1;
  /* small margin note */
  const note=spring(t-1.2,100,15);
  g.globalAlpha=note;
  g.fillStyle=P.accent;g.font='italic 600 28px Georgia';
  g.save();g.translate(x+40,y+ph-110);
  g.fillText('↳ 节奏，是引导的语言',0,0);
  g.restore();
  g.globalAlpha=1;
  g.restore();
}

/* scene 3: phrase resolves — word swaps */
function m3Swap(t){
  paperBg(t,0,0);
  const z=1+clamp(t/2.5)*0.06;
  g.save();
  const bx=W*0.5,by=H*0.46;
  g.translate(bx,by);g.scale(z,z);g.translate(-bx,-by);
  g.textAlign='center';g.textBaseline='middle';
  /* static frame words */
  g.fillStyle=P.soft;g.font='600 40px Inter';
  g.fillText('它不是',bx,by-120);
  const pairs=[['装饰','语言'],['噪音','信号'],['停顿','呼吸']];
  const slot=Math.floor(t/0.8);
  const lt=clamp((t%0.8)/0.8);
  const word=pairs[Math.min(slot,pairs.length-1)];
  /* old word out, new word in */
  for(let w=0;w<2;w++){
    const wp=w===0?clamp(1-lt*1.6):clamp((lt-0.3)*1.8);
    const yo=by+(w*140);
    g.globalAlpha=wp;
    const col=w===0?P.soft:P.accent;
    g.fillStyle=col;g.font=(w===0?'600':'800')+' 110px Georgia';
    g.fillText(w===0?word[0]:word[1],bx,yo+20);
  }
  g.globalAlpha=1;
  g.restore();
}

/* scene 4: thought — a sentence with highlighted word */
function m4Think(t){
  paperBg(t,Math.sin(t*0.3)*8,0);
  const z=1+clamp(t/2.5)*0.04;
  g.save();
  const bx=W*0.5,by=H*0.46;
  g.translate(bx,by);g.scale(z,z);g.translate(-bx,-by);
  g.textAlign='center';g.textBaseline='middle';
  const r=spring(t-0.1,110,17);
  g.globalAlpha=r;
  g.fillStyle=P.ink;g.font='700 52px Georgia';
  g.fillText('好的节奏，让人',bx,by-60);
  /* highlighted word */
  const hp=spring(t-0.6,120,17);
  g.globalAlpha=hp;
  const hw='专注';
  g.font='800 120px Georgia';
  const hwW=g.measureText(hw).width;
  g.fillStyle='rgba(201,98,63,.18)';
  rr(bx-hwW/2-24,by+20,hwW+48,140,14);g.fill();
  g.fillStyle=P.accent;
  g.fillText(hw,bx,by+88);
  g.globalAlpha=spring(t-1.1,100,15);
  g.fillStyle=P.ink;g.font='700 52px Georgia';
  g.fillText('而不是分神',bx,by+210);
  g.globalAlpha=1;
  g.restore();
}

/* scene 5: hard cuts of margin notes */
function m5Cuts(t){
  paperBg(t,0,0);
  const notes=[
    {x:130,y:560,w:360,h:280,t:'慢一点'},
    {x:540,y:560,w:380,h:280,t:'留白'},
    {x:130,y:920,w:360,h:300,t:'停在重点'},
    {x:540,y:920,w:380,h:300,t:'再推进'},
  ];
  for(let i=0;i<notes.length;i++){
    const n=notes[i];
    const p=spring(t-0.1-i*0.35,130,18);
    g.globalAlpha=p;
    g.fillStyle=P.card;g.save();
    g.translate(n.x+n.w/2,n.y+n.h/2);g.scale(0.92+0.08*p,0.92+0.08*p);g.translate(-(n.x+n.w/2),-(n.y+n.h/2));
    g.shadowColor='rgba(90,80,60,.18)';g.shadowBlur=24;g.shadowOffsetY=10;
    rr(n.x,n.y,n.w,n.h,18);g.fill();
    g.shadowBlur=0;g.shadowOffsetY=0;g.strokeStyle=P.line;g.lineWidth=1.5;rr(n.x,n.y,n.w,n.h,18);g.stroke();
    g.fillStyle=i%2?P.accent2:P.accent;g.font='800 56px Georgia';g.textAlign='center';g.textBaseline='middle';
    g.fillText(n.t,n.x+n.w/2,n.y+n.h/2+6);
    g.restore();
  }
  g.globalAlpha=1;
}

/* scene 6: logo lockup */
function m6Logo(t){
  g.fillStyle=P.paper;g.fillRect(0,0,W,H);
  const gr=g.createRadialGradient(W*0.5,H*0.42,120,W*0.5,H*0.5,1000);
  gr.addColorStop(0,'rgba(255,253,247,.9)');gr.addColorStop(1,'rgba(226,218,205,.5)');
  g.fillStyle=gr;g.fillRect(0,0,W,H);
  const cx=W*0.5,cy=H*0.44;
  const p=spring(t-0.0,130,18);
  g.save();g.translate(cx,cy);g.globalAlpha=p;
  /* margin mark: a bracket / paragraph glyph */
  g.strokeStyle=P.accent;g.lineWidth=8;g.lineCap='round';
  g.beginPath();
  g.moveTo(-30,-70);g.lineTo(-30,70);
  g.moveTo(-30,-70);g.lineTo(6,-70);
  g.moveTo(-30,70);g.lineTo(6,70);
  g.stroke();
  g.fillStyle=P.ink;g.font='800 110px Georgia';g.textAlign='center';g.textBaseline='middle';
  g.fillText('M',34,4);
  g.restore();
  const tp=spring(t-0.3,120,17);
  g.globalAlpha=tp;g.textAlign='center';g.textBaseline='middle';
  g.fillStyle=P.ink;g.font='800 74px Georgia';
  g.fillText('Margin',cx,cy+170);
  g.fillStyle=P.soft;g.font='500 32px Inter';
  g.fillText('让每一句话，都有位置',cx,cy+240);
  g.globalAlpha=1;
}

const SCENES=[
  {from:0,to:2.5,draw:m1Hook,out:'push-through'},
  {from:2.5,to:5.5,draw:m2Type,out:'match-cut'},
  {from:5.5,to:8,draw:m3Swap,out:'match-cut'},
  {from:8,to:10.5,draw:m4Think,out:'match-cut'},
  {from:10.5,to:12.5,draw:m5Cuts,out:'match-cut'},
  {from:12.5,to:15,draw:m6Logo,out:'hold'},
];

function drawWrapped(i,lt,zoom,alpha,blur,dx){
  g.save();
  g.globalAlpha=alpha;
  if(blur>0.2)g.filter='blur('+blur+'px)';
  g.translate(dx,0);
  g.translate(W/2,H/2);g.scale(zoom,zoom);g.translate(-W/2,-H/2);
  SCENES[i].draw(lt);
  g.restore();
}
function draw(t){
  g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,W,H);
  let i=SCENES.findIndex(s=>t>=s.from&&t<s.to);
  if(i<0)i=SCENES.length-1;
  const s=SCENES[i];
  const lt=t-s.from;
  const seamLen=0.32;
  const into=t-s.from; // time since shot start
  /* first frame complete rule */
  if(i===0){drawWrapped(0,lt,1,1,0,0);vignette();grain(t);return;}
  /* draw current scene; if near a seam, blend with previous according to type */
  const prevType=SCENES[i-1].out;
  if(into<seamLen && prevType!=='hard-cut'){
    const p=into/seamLen;
    if(prevType==='push-through'){
      const e=easeInOutCubic(p);
      drawWrapped(i-1,SCENES[i-1].to-SCENES[i-1].from,1+0.1*e,1-e,5*e,-30*e);
      drawWrapped(i,0,1.1-0.1*e,e,5*(1-e),60*(1-e));
    }else if(prevType==='match-cut'){
      const e=easeOutCubic(p);
      drawWrapped(i-1,SCENES[i-1].to-SCENES[i-1].from,1,1,0,0);
      drawWrapped(i,0,1.05-0.05*e,e,3*(1-e),0);
    }else if(prevType==='whip-cut'){
      const e=easeInOutCubic(p);
      drawWrapped(i-1,SCENES[i-1].to-SCENES[i-1].from,1.02,1-p,14*(1-p),-W*0.6*e);
      drawWrapped(i,0,1.02,e,14*(1-e),W*0.6*(1-e));
    }
  }else{
    drawWrapped(i,lt,1,1,0,0);
  }
  /* hard-cut flash-free: just a tiny alpha pop */
  if(prevType==='hard-cut' && into<0.09){
    drawWrapped(i,lt,1,clamp(into/0.09),0,0);
  }
  vignette();grain(t);
}
window.seek=(t)=>{t=clamp(t,0,DUR);draw(t);window.__auto=false;window.__curT=t;return true;};
window.play=(t0)=>{if(typeof t0==='number')window.__curT=t0;window.__auto=true;};
window.pause=()=>{window.__auto=false;};
window.getTime=()=>window.__curT||0;
window.DUR=DUR;
let __curT=0,lastNow=performance.now();
if(!navigator.webdriver){
  (function loop(){
    const now=performance.now();
    if(window.__auto!==false){__curT=(__curT+(now-lastNow)/1000)%DUR;window.__curT=__curT;draw(__curT);}
    lastNow=now;
    requestAnimationFrame(loop);
  })();
}
</script>
</body>
</html>
